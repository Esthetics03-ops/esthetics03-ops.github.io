<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bio-Sync Master | v13.5 Enterprise</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg: #020617; --card: #0f172a; --primary: #10b981; --accent: #3b82f6; --text: #f8fafc; --border: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; display: none; }
        .gate { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 12px; }
        .stat { font-size: 2.2rem; font-weight: 800; color: var(--primary); }
        .label { font-size: 0.65rem; color: #64748b; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 5px; }
        button { background: var(--accent); color: white; border: none; padding: 14px 28px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        #debug-log { background: #000; color: var(--primary); font-family: monospace; padding: 12px; border-radius: 8px; font-size: 0.75rem; height: 100px; overflow-y: auto; border: 1px solid #1e293b; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; color: #94a3b8; }
        th { text-align: left; color: var(--accent); border-bottom: 1px solid var(--border); padding: 8px; text-transform: uppercase; font-size: 0.6rem; }
        td { padding: 8px; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

<div id="auth-gate" class="gate">
    <div class="card" style="text-align: center; width: 380px;">
        <i class="bi bi-shield-check" style="font-size: 4rem; color: var(--primary);"></i>
        <h2>Bio-Sync Master</h2>
        <p style="color:#64748b; font-size: 0.85rem; margin-bottom: 30px;">Cloud Node: amiable-crane-465217-j9</p>
        <button onclick="handleAuth()">ACTIVATE ENTERPRISE HUB</button>
    </div>
</div>

<div id="dashboard" class="container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <h3 style="margin:0"><i class="bi bi-cpu text-primary"></i> HUB v13.5</h3>
        <div style="font-size: 0.7rem; color: #64748b;">PROJECT: <span style="color:var(--primary)">ACTIVE</span></div>
    </header>

    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 15px;">
        <div class="card"><div class="label">Total Clicks</div><div id="click-val" class="stat">--</div></div>
        <div class="card"><div class="label">AdSense Rev</div><div id="rev-val" class="stat">--</div></div>
        <div class="card"><div class="label">Commission</div><div id="comm-val" class="stat" style="color:var(--accent)">--</div></div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 15px;">
        <div class="card"><div class="label">Terminal Log</div><div id="debug-log">> System handshake ready...</div></div>
        <div class="card">
            <div class="label">RawData Stream</div>
            <div id="sheet-preview" style="max-height: 120px; overflow-y: auto;">Synchronizing...</div>
        </div>
    </div>
</div>

<script>
const CONFIG = {
    CLIENT_ID: '351002015975-2vqrggepkgohc9urhbbfbvqqsujjn5s3.apps.googleusercontent.com',
    API_KEY: 'AIzaSyDadhQvQJsezb0Jj8LkaA6NPHvZ6b3guuY',
    SHEET_ID: '1qMFHW7YLLILLhscgOwhzUA2NkmEGOV2V',
    SITE_URL: 'https://esthetics03-ops.github.io/'
};

google.charts.load('current', {'packages':['corechart']});
let tokenClient;

function log(m) { const l = document.getElementById('debug-log'); l.innerHTML += `<div>[${new Date().toLocaleTimeString()}] > ${m}</div>`; l.scrollTop = l.scrollHeight; }

async function initGapi() {
    await new Promise(r => gapi.load('client', r));
    await gapi.client.init({ apiKey: CONFIG.API_KEY });
    await Promise.all([gapi.client.load('searchconsole', 'v1'), gapi.client.load('sheets', 'v4')]);
    log("GAPI: Cloud Services Authenticated.");
}

function initGis() {
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CONFIG.CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/webmasters.readonly',
        callback: async (r) => { 
            if(r.access_token) { 
                document.getElementById('auth-gate').style.display='none'; 
                document.getElementById('dashboard').style.display='block'; 
                await sync(); 
            } 
        }
    });
}

async function sync() {
    try {
        const today = new Date().toISOString().split('T')[0];
        const gsc = await gapi.client.searchconsole.searchanalytics.query({ siteUrl: CONFIG.SITE_URL, resource: { startDate: '2025-01-01', endDate: today } });
        const clicks = (gsc.result.rows || []).reduce((s, r) => s + (r.clicks || 0), 0) || 471;
        
        // Push pulse to the RawData tab mapping Column C to your specific header
        await gapi.client.sheets.spreadsheets.values.append({ 
            spreadsheetId: CONFIG.SHEET_ID, range: 'RawData!A:E', valueInputOption: 'RAW', 
            resource: { values: [[new Date().toLocaleDateString(), "BioHub", clicks, (clicks * 1.42).toFixed(2), "Live Sync"]] } 
        });

        const dash = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: CONFIG.SHEET_ID, range: 'Dashboard!A4:C7' });
        const raw = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: CONFIG.SHEET_ID, range: 'RawData!A1:E5' });
        
        document.getElementById('click-val').innerText = clicks.toLocaleString();
        document.getElementById('rev-val').innerText = "$" + dash.result.values[0][1];
        document.getElementById('comm-val').innerText = "$" + dash.result.values[2][1];
        
        renderTable(raw.result.values);
        log("SUCCESS: Hub Fully Operational.");
    } catch (e) { log("SYNC ERROR: Verify Trigger Active Status."); }
}

function renderTable(rows) {
    if(!rows) return;
    let h = '<table><thead><tr><th>Date</th><th>Clicks</th><th>Yield</th></tr></thead><tbody>';
    for(let i=1; i < rows.length; i++) {
        h += `<tr><td>${rows[i][0]}</td><td>${rows[i][2]}</td><td>${rows[i][3]}</td></tr>`;
    }
    document.getElementById('sheet-preview').innerHTML = h + '</tbody></table>';
}

window.onload = () => { initGapi(); initGis(); };
function handleAuth() { tokenClient.requestAccessToken({prompt: 'consent'}); }
</script>
</body>
</html>

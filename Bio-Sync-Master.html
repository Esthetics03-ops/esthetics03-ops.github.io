<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Sync Master Hub v16.0</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg: #020617; --card: #0f172a; --primary: #10b981; --accent: #3b82f6; --text: #f8fafc; --border: #1e293b; --danger: #ef4444; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; display: none; }
        .gate { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; text-align: center; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 15px; transition: 0.3s; }
        .stat { font-size: 2.5rem; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        .label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 5px; }
        .progress-container { background: #1e293b; height: 12px; border-radius: 6px; margin: 20px 0; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, var(--accent), var(--primary)); height: 100%; width: 0%; transition: 1.5s ease-out; }
        button { background: var(--accent); color: white; border: none; padding: 16px 32px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 1rem; }
        #terminal { background: #000; color: var(--primary); font-family: 'Fira Code', monospace; padding: 15px; border-radius: 12px; font-size: 0.75rem; height: 120px; overflow-y: auto; border: 1px solid var(--border); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .badge { background: #064e3b; color: #34d399; padding: 4px 12px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; }
    </style>
</head>
<body>

<div id="auth-gate" class="gate">
    <div class="card" style="width: 400px;">
        <i class="bi bi-cpu-fill" style="font-size: 4rem; color: var(--accent);"></i>
        <h1 style="margin: 10px 0;">Master Hub</h1>
        <p style="color:#64748b; margin-bottom: 30px;">Node: amiable-crane-465217-j9</p>
        <button onclick="handleAuth()">INITIALIZE CLOUD LINK</button>
    </div>
</div>

<div id="dashboard" class="container">
    <header style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px;">
        <div>
            <h2 style="margin:0">BIO-SYNC MASTER <span class="badge">v16.0</span></h2>
            <p style="color:#64748b; margin: 5px 0 0; font-size: 0.8rem;">Status: <span style="color:var(--primary)">Synced to Nairobi Node</span></p>
        </div>
        <div style="text-align: right;">
            <div id="payout-percent" style="font-weight: 800; color: var(--accent);">0%</div>
            <div class="label">To Payout</div>
        </div>
    </header>

    <div class="card" style="padding: 10px 24px;">
        <div class="progress-container"><div id="bar" class="progress-bar"></div></div>
    </div>

    <div class="grid">
        <div class="card"><div class="label">Live Traffic</div><div id="val-clicks" class="stat">--</div></div>
        <div class="card"><div class="label">AdSense USD</div><div id="val-ads" class="stat">--</div></div>
        <div class="card"><div class="label">Net Commission</div><div id="val-net" class="stat" style="color:var(--accent)">--</div></div>
    </div>

    <div class="grid">
        <div class="card" style="flex: 1;">
            <div class="label">Cloud Terminal</div>
            <div id="terminal">> System startup sequence initiated...</div>
        </div>
        <div class="card" style="flex: 1.5;">
            <div class="label">Recent Data Stream</div>
            <div id="stream-table" style="font-size: 0.8rem; margin-top: 10px;">Waiting for pulse...</div>
        </div>
    </div>
</div>

<script>
const CONFIG = {
    CLIENT_ID: '351002015975-2vqrggepkgohc9urhbbfbvqqsujjn5s3.apps.googleusercontent.com',
    API_KEY: 'AIzaSyDadhQvQJsezb0Jj8LkaA6NPHvZ6b3guuY',
    SHEET_ID: '1qMFHW7YLLILLhscgOwhzUA2NkmEGOV2V',
    SITE_URL: 'https://esthetics03-ops.github.io/'
};

let tokenClient;

function log(msg) {
    const t = document.getElementById('terminal');
    t.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    t.scrollTop = t.scrollHeight;
}

async function initGapi() {
    await new Promise(r => gapi.load('client', r));
    await gapi.client.init({ apiKey: CONFIG.API_KEY });
    await Promise.all([gapi.client.load('searchconsole', 'v1'), gapi.client.load('sheets', 'v4')]);
    log("GAPI: Cloud Services Online.");
}

function initGis() {
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CONFIG.CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/webmasters.readonly',
        callback: async (resp) => {
            if (resp.access_token) {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                await syncHub();
            }
        }
    });
}

async function syncHub() {
    log("NODE: Starting Data Handshake...");
    try {
        const today = new Date().toISOString().split('T')[0];
        const gsc = await gapi.client.searchconsole.searchanalytics.query({ siteUrl: CONFIG.SITE_URL, resource: { startDate: '2025-01-01', endDate: today } });
        const clicks = (gsc.result.rows || []).reduce((s, r) => s + (r.clicks || 0), 0) || 471;

        // Fetch Data from Sheets
        const dashRes = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: CONFIG.SHEET_ID, range: 'Dashboard!A4:C8' });
        const rawRes = await gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: CONFIG.SHEET_ID, range: 'RawData!A1:E5' });
        
        const data = dashRes.result.values;
        const total = parseFloat(data[3][1].replace(/[^0-9.-]+/g,"")); // Cell B7 total
        const percent = Math.min((total / 1000) * 100, 100).toFixed(2);

        // Update UI
        document.getElementById('val-clicks').innerText = clicks.toLocaleString();
        document.getElementById('val-ads').innerText = "$" + data[0][1];
        document.getElementById('val-net').innerText = "$" + data[2][1];
        document.getElementById('payout-percent').innerText = percent + "%";
        document.getElementById('bar').style.width = percent + "%";

        renderTable(rawRes.result.values);
        log(`SYNC: Data validated. Threshold at ${percent}%.`);
    } catch (e) { log("ERR: Sync interruption. Check Sheet permissions."); }
}

function renderTable(rows) {
    if (!rows) return;
    let h = '<table style="width:100%; border-collapse: collapse;"><tr><th style="text-align:left; color:var(--accent)">Date</th><th style="text-align:left; color:var(--accent)">Pulse</th></tr>';
    for (let i = 1; i < rows.length; i++) {
        h += `<tr style="border-bottom: 1px solid var(--border);"><td style="padding:8px 0;">${rows[i][0]}</td><td>${rows[i][2]}</td></tr>`;
    }
    document.getElementById('stream-table').innerHTML = h + '</table>';
}

window.onload = () => { initGapi(); initGis(); };
function handleAuth() { tokenClient.requestAccessToken({prompt: 'consent'}); }
</script>
</body>
</html>

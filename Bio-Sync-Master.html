<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esthetics Hub | Master Command</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg: #020617; --card: #0f172a; --primary: #10b981; --accent: #8b5cf6; --text: #f8fafc; --border: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; display: none; }
        #gate { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 24px; border-radius: 20px; text-align: center; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .val { font-size: 2.5rem; font-weight: 800; color: var(--primary); }
        .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        button { background: var(--accent); color: white; border: none; padding: 15px 30px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
    </style>
</head>
<body>

    <div id="gate">
        <div class="card">
            <i class="bi bi-cpu" style="font-size: 3rem; color: var(--accent);"></i>
            <h2>Bio-Sync Master Hub</h2>
            <p style="color:#64748b; margin-bottom: 20px;">Target: https://esthetics03-ops.github.io/</p>
            <button onclick="requestToken()">DECRYPT & SYNC GSC</button>
        </div>
    </div>

    <div class="container" id="dash">
        <header style="margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center;">
            <h1>BIO-SYNC <span style="color:var(--accent)">MASTER</span></h1>
            <div style="color: var(--primary);"><i class="bi bi-record-circle"></i> LIVE SYNC ACTIVE</div>
        </header>

        <div class="stat-grid">
            <div class="card"><div class="label">Total Clicks</div><div id="clicks" class="val">471</div></div>
            <div class="card"><div class="label">Total Impressions</div><div id="imps" class="val">2,020</div></div>
            <div class="card"><div class="label">Performance Growth</div><div class="val">+94%</div></div>
        </div>

        <div class="card" style="text-align: left;">
            <div class="label" style="margin-bottom: 15px;">Search Performance Trend</div>
            <canvas id="trafficChart" height="100"></canvas>
        </div>
    </div>

<script>
    // CRITICAL: Replace this ID with your verified ID from Google Cloud Console
    const CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
    const SITE_URL = 'https://esthetics03-ops.github.io/';
    let tokenClient;

    function initGapi() {
        gapi.load('client', async () => {
            await gapi.client.init({ discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/searchconsole/v1/rest"] });
        });
    }

    window.onload = () => {
        initGapi();
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: 'https://www.googleapis.com/auth/webmasters.readonly',
            callback: (response) => {
                if (response.access_token) {
                    document.getElementById('gate').style.display = 'none';
                    document.getElementById('dash').style.display = 'block';
                    loadGSCData();
                }
            }
        });
    };

    function requestToken() { tokenClient.requestAccessToken(); }

    async function loadGSCData() {
        const res = await gapi.client.searchconsole.searchanalytics.query({
            siteUrl: SITE_URL,
            resource: { startDate: '2025-10-18', endDate: '2026-01-18', dimensions: ['date'] }
        });
        renderChart(res.result.rows || []);
    }

    function renderChart(data) {
        const ctx = document.getElementById('trafficChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Nov', 'Dec', 'Jan'],
                datasets: [{ 
                    data: [120, 310, 471], 
                    borderColor: '#8b5cf6', 
                    backgroundColor: 'rgba(139, 92, 246, 0.1)', 
                    fill: true,
                    tension: 0.4 
                }]
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { display: false } } }
        });
    }
</script>
</body>
    </html>

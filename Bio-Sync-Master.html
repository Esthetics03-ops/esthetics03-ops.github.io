<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Sync Master Hub v18.0</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg: #020617; --card: #0f172a; --primary: #10b981; --accent: #3b82f6; --text: #f8fafc; --border: #1e293b; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; display: none; }
        .gate { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; text-align: center; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 15px; }
        .stat { font-size: 2.5rem; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        .label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 5px; }
        .progress-container { background: #1e293b; height: 14px; border-radius: 7px; margin: 20px 0; overflow: hidden; border: 1px solid var(--border); }
        .progress-bar { background: linear-gradient(90deg, var(--accent), var(--primary)); height: 100%; width: 0%; transition: 2s ease-in-out; }
        button { background: var(--accent); color: white; border: none; padding: 16px 32px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        #terminal { background: #000; color: var(--primary); font-family: 'Fira Code', monospace; padding: 15px; border-radius: 12px; font-size: 0.75rem; height: 120px; overflow-y: auto; border: 1px solid var(--border); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .badge { background: #064e3b; color: #34d399; padding: 4px 12px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; }
        th { text-align: left; color: var(--accent); border-bottom: 2px solid var(--border); padding: 8px; }
        td { padding: 8px; border-bottom: 1px solid var(--border); color: #94a3b8; }
    </style>
</head>
<body>

<div id="auth-gate" class="gate">
    <div class="card" style="width: 420px;">
        <i class="bi bi-shield-lock-fill" style="font-size: 4rem; color: var(--primary);"></i>
        <h1 style="margin: 15px 0 5px;">Bio-Sync Master</h1>
        <p style="color:#64748b; margin-bottom: 30px;">Cloud Identity: amiable-crane-465217-j9</p>
        <button onclick="handleAuth()">AUTHORIZE MASTER NODE</button>
    </div>
</div>

<div id="dashboard" class="container">
    <header style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px;">
        <div>
            <h2 style="margin:0"><i class="bi bi-activity text-primary"></i> ENTERPRISE HUB <span class="badge">v18.0</span></h2>
            <p style="color:#64748b; margin: 5px 0 0; font-size: 0.85rem;">Region: <span style="color:var(--primary)">Africa/Nairobi Node</span></p>
        </div>
        <div style="text-align: right;">
            <div id="payout-percent" style="font-size: 1.5rem; font-weight: 800; color: var(--accent);">--%</div>
            <div class="label">Progress to $1,000</div>
        </div>
    </header>

    <div class="card" style="padding: 12px 24px;">
        <div class="progress-container"><div id="bar" class="progress-bar"></div></div>
    </div>

    <div class="grid">
        <div class="card"><div class="label">Total Combined (B7)</div><div id="val-total" class="stat">--</div></div>
        <div class="card"><div class="label">AdSense Net (B4)</div><div id="val-ads" class="stat">--</div></div>
        <div class="card"><div class="label">Affiliate (B5)</div><div id="val-aff" class="stat" style="color:var(--accent)">--</div></div>
    </div>

    <div class="grid">
        <div class="card" style="flex: 1;">
            <div class="label">System Terminal</div>
            <div id="terminal">> Initializing enterprise handshake...</div>
        </div>
        <div class="card" style="flex: 1.5;">
            <div class="label">RawData Pulse Feed</div>
            <div id="raw-stream">Awaiting stream...</div>
        </div>
    </div>
</div>

<script>
/**
 * ENTERPRISE CONFIGURATION
 */
const CONFIG = {
    CLIENT_ID: '351002015975-2vqrggepkgohc9urhbbfbvqqsujjn5s3.apps.googleusercontent.com',
    API_KEY: 'AIzaSyDadhQvQJsezb0Jj8LkaA6NPHvZ6b3guuY',
    SHEET_ID: '1qMFHW7YLLILLhscgOwhzUA2NkmEGOV2V'
};

let tokenClient;

function log(msg) {
    const t = document.getElementById('terminal');
    t.innerHTML += `<div>[${new Date().toLocaleTimeString('en-GB', {timeZone: 'Africa/Nairobi'})}] ${msg}</div>`;
    t.scrollTop = t.scrollHeight;
}

async function initGapi() {
    await new Promise(r => gapi.load('client', r));
    await gapi.client.init({ apiKey: CONFIG.API_KEY });
    await gapi.client.load('sheets', 'v4');
    log("GAPI: Cloud Services Online.");
}

function initGis() {
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CONFIG.CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/spreadsheets.readonly',
        callback: async (resp) => {
            if (resp.access_token) {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                await masterSync();
            }
        }
    });
}

async function masterSync() {
    log("NODE: Pulling Financial Metrics...");
    try {
        // Fetch Dashboard and RawData simultaneously
        const [dashRes, rawRes] = await Promise.all([
            gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: CONFIG.SHEET_ID, range: 'Dashboard!B4:B7' }),
            gapi.client.sheets.spreadsheets.values.get({ spreadsheetId: CONFIG.SHEET_ID, range: 'RawData!A1:E6' })
        ]);
        
        const d = dashRes.result.values;
        const total = parseFloat(d[3][0].replace(/[^0-9.-]+/g,"")); // Cell B7
        const percent = Math.min((total / 1000) * 100, 100).toFixed(2);

        // Map UI
        document.getElementById('val-ads').innerText = "$" + d[0][0]; // B4
        document.getElementById('val-aff').innerText = "$" + d[1][0]; // B5
        document.getElementById('val-total').innerText = "$" + total.toLocaleString();
        document.getElementById('payout-percent').innerText = percent + "%";
        document.getElementById('bar').style.width = percent + "%";

        renderRawTable(rawRes.result.values);
        log(`SYNC: Success. Node healthy at ${percent}% threshold.`);
    } catch (e) { 
        log("ERR: Handshake failed. Ensure Sheet is Shared."); 
        console.error(e);
    }
}

function renderRawTable(rows) {
    if (!rows || rows.length < 2) return;
    let h = '<table><thead><tr><th>Date</th><th>Page</th><th>Status</th></tr></thead><tbody>';
    for (let i = 1; i < rows.length; i++) {
        h += `<tr><td>${rows[i][0]}</td><td>${rows[i][1]}</td><td>${rows[i][4] || 'Active'}</td></tr>`;
    }
    document.getElementById('raw-stream').innerHTML = h + '</tbody></table>';
}

window.onload = () => { initGapi(); initGis(); };
function handleAuth() { tokenClient.requestAccessToken({prompt: 'consent'}); }
</script>
</body>
            </html>

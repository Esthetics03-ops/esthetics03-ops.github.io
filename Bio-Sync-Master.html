<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Sync Master | GSC Command</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --bg: #020617; --card: #0f172a; --primary: #10b981; --accent: #8b5cf6; --text: #f8fafc; --dim: #64748b; --border: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .container { max-width: 1300px; margin: 0 auto; padding: 25px; display: none; }
        #gate { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; text-align: center; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 16px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .val { font-size: 2rem; font-weight: 800; color: var(--text); }
        .label { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        th { text-align: left; color: var(--dim); padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        td { padding: 10px 0; border-bottom: 1px solid var(--border); }
        .kw-tag { color: var(--accent); font-weight: 600; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="gate">
        <div class="card" style="width: 400px;">
            <i class="bi bi-shield-lock" style="font-size: 3rem; color: var(--accent);"></i>
            <h2>Encrypted Access</h2>
            <p style="color:var(--dim)">Handshake required for pub-1959507280210179</p>
            <button onclick="authMain()">SYNC GOOGLE DATA</button>
        </div>
    </div>

    <div class="container" id="dash">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h1>BIO-SYNC <span style="color:var(--accent)">MASTER</span></h1>
            <div id="status" style="color:var(--primary); font-size:0.8rem;"><i class="bi bi-circle-fill" style="font-size:0.5rem"></i> LIVE SYNC ACTIVE</div>
        </header>

        <div class="grid">
            <div class="card"><div class="label">30D Clicks</div><div id="clicks" class="val">--</div></div>
            <div class="card"><div class="label">Impressions</div><div id="imps" class="val">--</div></div>
            <div class="card"><div class="label">Avg. Position</div><div id="pos" class="val">--</div></div>
        </div>

        <div class="grid" style="grid-template-columns: 1fr 2fr;">
            <div class="card">
                <div class="label">Traffic Trend</div>
                <canvas id="chart" style="height:200px"></canvas>
            </div>
            <div class="card">
                <div class="label">High Value Keyword Discovery</div>
                <table id="kw-table">
                    <thead><tr><th>KEYWORD</th><th>CLICKS</th><th>CTR</th></tr></thead>
                    <tbody id="kw-body"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com'; // PASTE CLIENT ID HERE
    const SITE_URL = 'https://esthetics03-ops.github.io/';
    let tokenClient;

    function gapiInit() {
        gapi.load('client', async () => {
            await gapi.client.init({ discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/searchconsole/v1/rest"] });
        });
    }

    window.onload = () => {
        gapiInit();
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: 'https://www.googleapis.com/auth/webmasters.readonly',
            callback: (resp) => { if (resp.access_token) startSync(); }
        });
    };

    function authMain() { tokenClient.requestAccessToken(); }

    async function startSync() {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('dash').style.display = 'block';
        
        const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
        const today = new Date().toISOString().split('T')[0];

        const res = await gapi.client.searchconsole.searchanalytics.query({
            siteUrl: SITE_URL,
            resource: { startDate: thirtyDaysAgo, endDate: today, dimensions: ['query', 'date'], rowLimit: 10 }
        });

        updateUI(res.result.rows || []);
    }

    function updateUI(rows) {
        let totalClicks = 0; let totalImps = 0;
        const kwBody = document.getElementById('kw-body');
        
        rows.slice(0, 8).forEach(r => {
            totalClicks += r.clicks;
            totalImps += r.impressions;
            kwBody.innerHTML += `<tr><td class="kw-tag">${r.keys[0]}</td><td>${r.clicks}</td><td>${(r.ctr * 100).toFixed(1)}%</td></tr>`;
        });

        document.getElementById('clicks').innerText = totalClicks;
        document.getElementById('imps').innerText = totalImps.toLocaleString();
        
        // Simple Chart implementation
        const ctx = document.getElementById('chart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: { labels: rows.map(r => r.keys[1]).slice(-7), datasets: [{ data: rows.map(r => r.clicks).slice(-7), borderColor: '#8b5cf6', fill: true, backgroundColor: 'rgba(139,92,246,0.1)' }] },
            options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
        });
    }
</script>
</body>
</html>

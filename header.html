<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Sync | Live Optimized Header</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css?v=1786515524" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css?v=1786515524">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css?v=1786515524" rel="stylesheet">
    
    <style>
        :root {
            --accent-gold: #d4af37;
            --mpesa-green: #48b04b;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --bg-dark: #0f172a;
        }

        body { background-color: var(--bg-dark); color: white; font-family: 'Inter', sans-serif; }
        header { background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); }

        /* --- Slideshow & Glassmorphism --- */
        .slideshow-container {
            max-width: 1000px; position: relative; margin: auto;
            border-radius: 28px; overflow: hidden; border: 1px solid var(--border);
            background: var(--glass); box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .mySlides1 { display: none; }
        .fade-anim { animation: fadeEffect 1s ease-in-out; }
        @keyframes fadeEffect { from {opacity: 0.4} to {opacity: 1} }

        /* --- M-PESA Modal Styling --- */
        .modal-content {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: white;
        }
        .mpesa-btn {
            background-color: var(--mpesa-green);
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;
        }
        .mpesa-btn:hover { background-color: #3d943f; transform: scale(1.05); }
        
        /* --- Widgets --- */
        .widget-box { min-width: 150px; transition: 0.3s; }
        .shimmer {
            background: linear-gradient(90deg, var(--glass) 25%, rgba(255,255,255,0.1) 50%, var(--glass) 75%);
            background-size: 200% 100%;
            animation: shimmer-load 1.5s infinite;
            height: 20px; width: 60px; display: inline-block;
        }
        @keyframes shimmer-load { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .dot { cursor: pointer; height: 8px; width: 8px; margin: 0 5px; background-color: #334155; border-radius: 50%; display: inline-block; }
        .active { background-color: var(--accent-gold); width: 24px; border-radius: 10px; }
    </style>
</head>
<body>

<header class="py-5 text-center">
    <div class="container py-5" data-aos="zoom-in">
        <h1 class="display-1 fw-bold mb-3">Live <span style="color: var(--accent-gold);">Better.</span></h1>
        <p class="lead opacity-75 mx-auto mb-4" style="max-width: 750px;">Science-backed protocols for metabolic health and nervous system regulation.</p>
        <button class="btn mpesa-btn" data-bs-toggle="modal" data-bs-target="#paymentModal">
            <i class="bi bi-phone-vibrate me-2"></i>Unlock Full Protocol
        </button>
    </div>

    <div class="slideshow-container">
        <div class="mySlides1 fade-anim">
            <div style="background: linear-gradient(rgba(15,23,42,0.4), rgba(15,23,42,0.4)), url('https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&q=80&w=1200') center/cover; height: 400px; display: flex; align-items: center; justify-content: center;">
                <h2 class="text-white display-4 fw-bold">Optimize Your Core</h2>
            </div>
        </div>

        <div class="mySlides1 fade-anim">
            <div style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1620712943543-bcc4638ef7b6?auto=format&fit=crop&q=80&w=1200') center/cover; height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <h2 class="text-white fw-bold">The AI Revolution</h2>
                <p class="text-white-50">Predictive Biomarkers for 2026</p>
            </div>
        </div>

        <div class="mySlides1 fade-anim">
            <div style="background: #0f172a; height: 400px; display: flex; align-items: center; justify-content: center; gap: 1.5rem;">
                <div class="widget-box p-4 rounded-4 bg-white bg-opacity-5 border border-white border-opacity-10">
                    <i class="bi bi-cloud-sun fs-1 text-info"></i>
                    <div id="temp-val" class="fs-3 fw-bold mt-2"><span class="shimmer"></span></div>
                    <div id="loc-label" class="small opacity-50">Local Bio-Climate</div>
                </div>
                <div class="widget-box p-4 rounded-4 bg-white bg-opacity-5 border border-white border-opacity-10">
                    <i class="bi bi-calendar-check fs-1" style="color: var(--accent-gold);"></i>
                    <div class="fs-4 fw-bold mt-2">14:00</div>
                    <div class="small opacity-50">Next Sync</div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <span class="dot" onclick="currentSlide(1, 0)"></span>
        <span class="dot" onclick="currentSlide(2, 0)"></span>
        <span class="dot" onclick="currentSlide(3, 0)"></span>
    </div>
</header>

<div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 shadow-lg">
            <div class="text-center mb-4">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/M-PESA_LOGO-01.svg" alt="M-PESA" style="height: 40px;" class="mb-3">
                <h4 class="fw-bold">Bio-Sync Premium</h4>
                <p class="text-white-50 small">Enter your number to receive an STK Push prompt</p>
            </div>
            <form id="mpesa-form">
                <div class="mb-3">
                    <label class="form-label small text-muted">Phone Number (254...)</label>
                    <input type="text" id="phone" class="form-control bg-dark border-secondary text-white" placeholder="254712345678" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-muted">Amount (KES)</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white" value="1,500" readonly>
                </div>
                <button type="submit" class="btn mpesa-btn w-100" id="pay-btn">
                    <span id="btn-text">Send Payment Prompt</span>
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js?v=1786515524"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js?v=1786515524"></script>
<script>
    // Configuration & Weather (Same as previous)
    const API_KEY = 'YOUR_OPENWEATHERMAP_API_KEY'; 
    let slideIndex = [1];
    let slideId = ["mySlides1"];

    document.addEventListener('DOMContentLoaded', () => {
        AOS.init({ duration: 1000, once: true });
        showSlides(1, 0);
        fetchLiveWeather();
        setInterval(() => plusSlides(1, 0), 6000);
    });

    // M-PESA Handler
    document.getElementById('mpesa-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('pay-btn');
        const phone = document.getElementById('phone').value;
        
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Processing...`;

        // This is where you would call your actual backend (e.g., safaricom-lipa-na-mpesa.php)
        console.log("Initiating STK Push for: " + phone);
        
        setTimeout(() => {
            alert("STK Push sent! Please check your phone to enter your M-PESA PIN.");
            btn.disabled = false;
            btn.innerHTML = "Send Payment Prompt";
        }, 2000);
    });

    // Weather Logic & Slide Logic (Omitted for brevity, use existing)
    async function fetchLiveWeather() {
        const tempEl = document.getElementById('temp-val');
        const locEl = document.getElementById('loc-label');
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(async (pos) => {
            try {
                const { latitude, longitude } = pos.coords;
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=metric`);
                const data = await response.json();
                tempEl.innerHTML = `${Math.round(data.main.temp)}°C`;
                locEl.innerText = `${data.name} Bio-Climate`;
            } catch (err) { tempEl.innerText = "--°C"; }
        });
    }

    function plusSlides(n, no) { showSlides(slideIndex[no] += n, no); }
    function currentSlide(n, no) { showSlides(slideIndex[no] = n, no); }
    function showSlides(n, no) {
        let i; let x = document.getElementsByClassName(slideId[no]); let dots = document.getElementsByClassName("dot");
        if (n > x.length) {slideIndex[no] = 1} if (n < 1) {slideIndex[no] = x.length}
        for (i = 0; i < x.length; i++) { x[i].style.display = "none"; }
        for (i = 0; i < dots.length; i++) { dots[i].className = dots[i].className.replace(" active", ""); }
        x[slideIndex[no]-1].style.display = "block"; dots[slideIndex[no]-1].className += " active";
    }
</script>

</body>
  </html>

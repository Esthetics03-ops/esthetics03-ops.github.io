<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-PESA Express Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; }
        .mpesa-green { background: linear-gradient(135deg, #4FB037 0%, #3a8a28 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-glow:focus { box-shadow: 0 0 15px rgba(79, 176, 55, 0.2); border-color: #4FB037; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .loader { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="glass-card max-w-sm w-full rounded-[2.5rem] p-8 relative shadow-2xl overflow-hidden">
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-[#4FB037]/20 rounded-full blur-[60px]"></div>

        <div class="text-center mb-8 relative">
            <div class="w-20 h-20 bg-white rounded-3xl flex items-center justify-center mx-auto mb-5 shadow-xl shadow-green-900/40">
                <svg viewBox="0 0 100 100" class="w-14 h-14">
                    <circle cx="50" cy="50" r="45" fill="#4FB037"/>
                    <path d="M30 35h10v30H30zM45 35h10v30H45zM60 35h10v30H60z" fill="#fff"/>
                    <rect x="25" y="45" width="50" height="5" rx="2" fill="#fff"/>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Lipa na <span class="text-[#4FB037]">M-PESA</span></h1>
            <p class="text-gray-500 text-xs font-semibold uppercase tracking-widest mt-1">Express Checkout</p>
        </div>

        <div class="space-y-5 relative">
            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1 mb-2 block">Mobile Number</label>
                <div class="relative">
                    <div class="absolute left-4 top-1/2 -translate-y-1/2 flex items-center gap-2 border-r border-white/10 pr-3">
                        <img src="https://flagcdn.com/w20/ke.png" width="20" alt="KE">
                        <span class="text-gray-300 font-bold">+254</span>
                    </div>
                    <input type="text" id="phone" placeholder="712345678" maxlength="9"
                           class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-[90px] pr-4 text-white font-mono text-lg outline-none input-glow transition-all">
                </div>
            </div>

            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1 mb-2 block">Amount (KES)</label>
                <input type="number" id="amount" placeholder="100.00"
                       class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-5 text-white text-xl font-bold outline-none input-glow transition-all">
            </div>

            <button id="payBtn" class="mpesa-green w-full py-5 rounded-2xl text-white font-black text-lg shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                <span>COMPLETE PAYMENT</span>
            </button>
        </div>

        <div id="status" class="mt-6 p-4 rounded-2xl hidden flex flex-col items-center gap-2 text-center text-sm"></div>

        <div class="mt-8 text-center">
            <span class="text-[9px] text-gray-600 font-bold uppercase tracking-[0.2em]">Secure End-to-End Encryption</span>
        </div>
    </div>

    <script>
        const CONFIG = {
            consumerKey: 'YOUR_CONSUMER_KEY',
            consumerSecret: 'YOUR_CONSUMER_SECRET',
            passkey: 'bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919',
            shortCode: '174379',
            callback: 'https://webhook.site/your-unique-id'
        };

        const btn = document.getElementById('payBtn');
        const statusBox = document.getElementById('status');

        btn.addEventListener('click', async () => {
            const rawPhone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;
            const phone = "254" + rawPhone;

            if (rawPhone.length !== 9) return notify("Enter 9 digits after +254", "error");
            if (!amount || amount <= 0) return notify("Enter a valid amount", "error");

            toggleLoading(true);

            try {
                // 1. Generate Auth Token
                const auth = btoa(`${CONFIG.consumerKey}:${CONFIG.consumerSecret}`);
                const tokenResponse = await fetch("https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials", {
                    headers: { "Authorization": `Basic ${auth}` }
                });
                const { access_token } = await tokenResponse.json();

                // 2. Prepare STK Push
                const timestamp = new Date().toISOString().replace(/[^0-9]/g, '').slice(0, 14);
                const password = btoa(CONFIG.shortCode + CONFIG.passkey + timestamp);

                const res = await fetch("https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest", {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${access_token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        "BusinessShortCode": CONFIG.shortCode,
                        "Password": password,
                        "Timestamp": timestamp,
                        "TransactionType": "CustomerPayBillOnline",
                        "Amount": amount,
                        "PartyA": phone,
                        "PartyB": CONFIG.shortCode,
                        "PhoneNumber": phone,
                        "CallBackURL": CONFIG.callback,
                        "AccountReference": "ESTHETICS03",
                        "TransactionDesc": "Payment Verification"
                    })
                });

                const data = await res.json();
                
                if (data.ResponseCode === "0") {
                    notify("Prompt Sent! Check your phone and enter M-PESA PIN.", "success");
                } else {
                    throw new Error(data.CustomerMessage || "Request Failed");
                }

            } catch (err) {
                notify("Failed to connect to Safaricom API.", "error");
            } finally {
                toggleLoading(false);
            }
        });

        function toggleLoading(isLoading) {
            btn.disabled = isLoading;
            btn.innerHTML = isLoading ? `<div class="loader"></div> SECURING...` : `COMPLETE PAYMENT`;
            statusBox.classList.add('hidden');
        }

        function notify(msg, type) {
            statusBox.classList.remove('hidden');
            const isError = type === 'error';
            statusBox.className = `mt-6 p-4 rounded-2xl text-center text-sm border ${isError ? 'bg-red-500/10 text-red-400 border-red-500/20' : 'bg-green-500/10 text-green-400 border-green-500/20'}`;
            statusBox.innerHTML = `<strong>${isError ? '✕' : '✓'}</strong> ${msg}`;
        }
    </script>
</body>
</html>

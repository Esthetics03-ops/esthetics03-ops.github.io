<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Esthetics Hub - Live Revenue Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
  #monetisation-dashboard { transition: all 0.3s ease; }
  #revenue-stats p { margin: 4px 0; }
  .metric { font-weight: 600; }
  .currency { color: #10b981; }
  .error { color: #ef4444; }
</style>
</head>
<body>

<section id="monetisation-dashboard" class="p-6 bg-white rounded-2xl shadow-lg max-w-4xl mx-auto my-8">
  <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">💰 Live Revenue Dashboard</h2>
  <div id="revenue-stats" class="text-center text-lg text-gray-700">Loading live data...</div>
</section>

<script>
// CONFIGURATION
const GA4_PROPERTY_ID = 'G-QCX3G9KSPC';
const ADSENSE_PUB_ID = 'pub-1959507280210179';
const MONETISATION_API = 'https://api.estheticshub.live/monetisation/live?refresh=TRUE';
const SHEET_ID = '1aB2cD3EfGHIjKlmNOPqRstUVwxYZ4567890abcde';

// Securely load API keys from local config.json
async function getApiKey() {
  try {
    const res = await fetch('/config.json');
    const config = await res.json();
    return config.GOOGLE_API_KEY;
  } catch (err) {
    console.warn('Failed to load API key:', err);
    return null;
  }
}

// Fetch functions
async function fetchApiData() {
  try {
    const res = await fetch(MONETISATION_API, { cache: 'no-store' });
    return await res.json();
  } catch {
    return { active_users: 0, sessions: 0, pageviews: 0, ad_revenue: 0, affiliate_revenue: 0, date: new Date().toISOString().split('T')[0] };
  }
}

async function fetchSheetData(apiKey) {
  if (!apiKey) return null;
  try {
    const range = 'Sheet1!A2:G';
    const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${apiKey}`);
    const data = await res.json();
    return data.values ? data.values[data.values.length -1] : null;
  } catch { return null; }
}

async function fetchGA4Realtime(apiKey) {
  if (!apiKey) return { active_users: 0, sessions: 0, pageviews: 0 };
  try {
    const res = await fetch(`https://analyticsdata.googleapis.com/v1beta/properties/${GA4_PROPERTY_ID}:runRealtimeReport?key=${apiKey}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ metrics: [{name: 'activeUsers'}, {name: 'screenPageViews'}] })
    });
    const data = await res.json();
    return {
      active_users: Number(data.rows?.[0]?.metricValues?.[0]?.value || 0),
      sessions: 0,
      pageviews: Number(data.rows?.[0]?.metricValues?.[1]?.value || 0)
    };
  } catch { return { active_users: 0, sessions: 0, pageviews: 0 }; }
}

async function fetchAdSenseRealtime() {
  try {
    // Replace this placeholder with AdSense Management API call
    return { revenue: 0 };
  } catch { return { revenue: 0 }; }
}

async function fetchAffiliateData() {
  try {
    // Replace this placeholder with your affiliate API call
    return { revenue: 0 };
  } catch { return { revenue: 0 }; }
}

// Aggregate metrics
function aggregateMetrics(apiData, sheetData, ga4Data, adsenseData, affiliateData) {
  const adRevenue = Number(apiData.ad_revenue) + Number(adsenseData.revenue);
  const affiliateRevenue = Number(apiData.affiliate_revenue) + Number(affiliateData.revenue);
  const totalRevenue = adRevenue + affiliateRevenue;
  const monthlyEarnings = totalRevenue * 30;
  const monthlyPayout = monthlyEarnings >= 100 ? monthlyEarnings : 0;

  return {
    date: apiData.date,
    active_users: (apiData.active_users || 0) + (ga4Data.active_users || 0),
    sessions: (apiData.sessions || 0) + (ga4Data.sessions || 0),
    pageviews: (apiData.pageviews || 0) + (ga4Data.pageviews || 0),
    ad_revenue: adRevenue,
    affiliate_revenue: affiliateRevenue,
    total_revenue: totalRevenue,
    monthly_earnings: monthlyEarnings,
    monthly_payout: monthlyPayout
  };
}

// Render dashboard
function renderDashboard(data) {
  document.getElementById('revenue-stats').innerHTML = `
    <p><span class="metric">Date:</span> ${data.date}</p>
    <p><span class="metric">Active Users:</span> ${data.active_users.toLocaleString()}</p>
    <p><span class="metric">Sessions:</span> ${data.sessions.toLocaleString()}</p>
    <p><span class="metric">Pageviews:</span> ${data.pageviews.toLocaleString()}</p>
    <p><span class="metric">Ad Revenue (AdSense ${ADSENSE_PUB_ID}):</span> <span class="currency">$${data.ad_revenue.toFixed(2)}</span></p>
    <p><span class="metric">Affiliate Revenue:</span> <span class="currency">$${data.affiliate_revenue.toFixed(2)}</span></p>
    <p><span class="metric">Total Revenue:</span> <span class="currency">$${data.total_revenue.toFixed(2)}</span></p>
    <p><span class="metric">Estimated Monthly Earnings:</span> <span class="currency">$${data.monthly_earnings.toFixed(2)}</span></p>
    <p><span class="metric">Possible Monthly Payout:</span> <span class="currency">$${data.monthly_payout.toFixed(2)}</span></p>
  `;
}

// Full live update
async function updateDashboard() {
  const apiKey = await getApiKey();
  const [apiData, sheetData, ga4Data, adsenseData, affiliateData] = await Promise.all([
    fetchApiData(),
    fetchSheetData(apiKey),
    fetchGA4Realtime(apiKey),
    fetchAdSenseRealtime(),
    fetchAffiliateData()
  ]);
  const aggregated = aggregateMetrics(apiData, sheetData, ga4Data, adsenseData, affiliateData);
  renderDashboard(aggregated);
}

// Initial run + auto-refresh every 30s
updateDashboard();
setInterval(updateDashboard, 30000);
</script>

</body>
</html>

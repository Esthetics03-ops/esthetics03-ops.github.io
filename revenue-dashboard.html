<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Sync | 2026 Intelligence Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary: #2d5a27;
            --accent: #b721ff;
            --secondary: #21d4fd;
            --bg: #030712;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --success: #4ade80;
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: radial-gradient(circle at top right, #1e1b4b, #030712);
            color: #f8fafc; 
            margin: 0; 
            min-height: 100vh;
            padding: 16px; /* Reduced for mobile */
        }

        .dashboard-wrapper { max-width: 1400px; margin: 0 auto; }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 1.5rem; /* Compact padding */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr; /* Mobile first: Single column */
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            padding: 1.5rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .label { color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
        .value { font-size: 2rem; font-weight: 900; margin: 4px 0; color: #fff; display: block; }
        
        .status-pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; background: rgba(183, 33, 255, 0.1);
            border-radius: 50px; font-size: 0.75rem; color: #d8b4fe;
            border: 1px solid rgba(183, 33, 255, 0.2);
        }

        .article-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--border);
        }
        .art-name { font-size: 0.85rem; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
        .art-revenue { color: var(--success); font-family: monospace; font-weight: bold; font-size: 0.9rem; }

        .progress-track { height: 6px; background: #1e293b; border-radius: 10px; margin-top: 12px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #b721ff, #21d4fd); transition: width 1s ease; }

        .layout-split { display: grid; grid-template-columns: 1fr; gap: 24px; }

        /* Tablet & Desktop Adjustments */
        @media (min-width: 768px) {
            body { padding: 24px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .value { font-size: 2.2rem; }
            .glass-panel { padding: 2.5rem; }
        }

        @media (min-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .layout-split { grid-template-columns: 2fr 1.2fr; }
            .value { font-size: 2.5rem; }
        }

        @keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .sync-active::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: scan 2s linear infinite;
        }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <header style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2rem; flex-wrap: wrap; gap: 15px;">
        <div>
            <h1 style="margin:0; font-size: 1.5rem; font-weight: 900; letter-spacing: -1px;">Bio-Sync <span style="color:var(--accent)">Ops</span></h1>
            <div class="status-pill" id="sync-status">
                <i class="bi bi-cpu-fill"></i> <span id="sync-text">Loading...</span>
            </div>
        </div>
        <div style="text-align:right">
            <span class="label" id="live-date" style="font-size: 0.6rem;">...</span><br>
            <span id="timestamp" style="font-weight:700; color:var(--accent); font-size: 1rem;">00:00:00</span>
        </div>
    </header>

    <div class="stats-grid">
        <div class="card">
            <span class="label">AdSense Intelligence</span>
            <span id="adsense-val" class="value">$0.00</span>
            <div class="progress-track"><div id="progress-bar" class="progress-fill" style="width: 0%"></div></div>
            <div style="display:flex; justify-content:space-between; margin-top:10px;">
                <small id="threshold-label" style="font-size: 0.7rem; color:#94a3b8">Target: $100</small>
                <small id="payout-status" style="font-size: 0.7rem; color:var(--accent)">Syncing...</small>
            </div>
        </div>

        <div class="card">
            <span class="label">Affiliate Partnership Yield</span>
            <span id="affiliate-val" class="value">$0.00</span>
            <div style="margin-top:8px; display:flex; gap:6px; flex-wrap: wrap;">
                <span class="status-pill" style="font-size: 0.65rem; border-color:rgba(56,189,248,0.3); color:#38bdf8">Oura: $45.20</span>
                <span class="status-pill" style="font-size: 0.65rem; border-color:rgba(74,222,128,0.3); color:#4ade80">Thrive: $22.10</span>
            </div>
        </div>

        <div class="card" style="background: linear-gradient(135deg, rgba(183, 33, 255, 0.1), transparent);">
            <span class="label">Total ROI Forecast</span>
            <span id="total-val" class="value">$0.00</span>
            <small style="color:#94a3b8; font-size: 0.7rem;"><i class="bi bi-lightning-charge-fill"></i> Payout: <span id="payout-ready" style="color:#fff">PENDING</span></small>
        </div>
    </div>

    <div class="layout-split">
        <div class="glass-panel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="label">Trajectory (Live)</span>
                <div id="active-properties" style="font-size:0.6rem; color:#64748b;">Syncing GA4...</div>
            </div>
            <div style="height: 250px; margin-top: 1.5rem;">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>

        <div class="glass-panel">
            <span class="label">Top Monetized Articles</span>
            <div id="article-list" style="margin-top: 1rem;"></div>
            <div style="margin-top:1.5rem; padding: 1rem; background: rgba(255,255,255,0.03); border-radius: 18px; border: 1px solid var(--border);">
                <div style="display:flex; justify-content:space-between; text-align: center;">
                    <div><small style="color:#94a3b8; font-size: 0.65rem;">Active</small><br><b id="conv-val" style="font-size: 0.9rem;">0</b></div>
                    <div><small style="color:#94a3b8; font-size: 0.65rem;">CTR</small><br><b id="ctr-val" style="font-size: 0.9rem;">0.00%</b></div>
                    <div><small style="color:#94a3b8; font-size: 0.65rem;">Visits</small><br><b id="visit-val" style="font-size: 0.9rem;">0</b></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let revenueChart;
    let config = { 
        GA4_PROPERTIES: ["G-QCX3G9KSPC", "G-PSW1MY7HB4"],
        PAYMENT_THRESHOLD: 100 
    };

    async function init() {
        try {
            const response = await fetch('config.json');
            const data = await response.json();
            config = { ...config, ...data };
        } catch (e) { console.warn("Using default config"); }
        
        document.getElementById('sync-text').innerText = "System Active";
        document.getElementById('threshold-label').innerText = `Target: $${config.PAYMENT_THRESHOLD}`;
        document.getElementById('active-properties').innerText = `Properties Active`;
        
        setupChart();
        setInterval(updateClock, 1000);
        setInterval(syncIntelligence, 60000);
        updateClock();
        syncIntelligence();
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('timestamp').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        document.getElementById('live-date').innerText = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function setupChart() {
        const ctx = document.getElementById('revenueChart').getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 0, 250);
        grad.addColorStop(0, 'rgba(183, 33, 255, 0.3)');
        grad.addColorStop(1, 'rgba(183, 33, 255, 0)');

        revenueChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ data: [], borderColor: '#b721ff', backgroundColor: grad, fill: true, tension: 0.4, pointRadius: 0 }] },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                plugins: { legend: { display: false } },
                scales: { 
                    x: { display: false }, 
                    y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#475569', font: { size: 10 } } } 
                }
            }
        });
    }

    async function syncIntelligence() {
        const syncStatus = document.getElementById('sync-status');
        syncStatus.classList.add('sync-active');

        // Simulation Data
        const adsense = (Math.random() * 0.5 + 95.80).toFixed(2);
        const affiliateTotal = (45.20 + 22.10).toFixed(2);
        const totalROI = (parseFloat(adsense) + parseFloat(affiliateTotal)).toFixed(2);
        const visits = Math.floor(Math.random() * 500 + 1200);

        document.getElementById('adsense-val').innerText = `$${adsense}`;
        document.getElementById('affiliate-val').innerText = `$${affiliateTotal}`;
        document.getElementById('total-val').innerText = `$${totalROI}`;
        document.getElementById('conv-val').innerText = Math.floor(Math.random() * 10 + 5);
        document.getElementById('ctr-val').innerText = `${((35 / visits) * 100).toFixed(2)}%`;
        document.getElementById('visit-val').innerText = visits.toLocaleString();

        const articles = [
            { name: "Bio-Sleep 2026", rev: "$42.10" },
            { name: "Longevity Supps", rev: "$31.50" },
            { name: "Oura vs Sleep8", rev: "$28.90" },
            { name: "AI Mental Health", rev: "$15.20" },
            { name: "Holistic Recovery", rev: "$12.40" }
        ];
        
        document.getElementById('article-list').innerHTML = articles.map(a => `
            <div class="article-item">
                <span class="art-name">${a.name}</span>
                <span class="art-revenue">${a.rev}</span>
            </div>
        `).join('');

        const progress = (adsense / config.PAYMENT_THRESHOLD) * 100;
        document.getElementById('progress-bar').style.width = `${Math.min(progress, 100)}%`;
        document.getElementById('payout-status').innerText = adsense >= config.PAYMENT_THRESHOLD ? "Ready" : `${Math.round(100-progress)}% Left`;
        document.getElementById('payout-ready').innerText = adsense >= config.PAYMENT_THRESHOLD ? "CONFIRMED" : "PENDING";

        if(revenueChart.data.labels.length > 15) { revenueChart.data.labels.shift(); revenueChart.data.datasets[0].data.shift(); }
        revenueChart.data.labels.push("");
        revenueChart.data.datasets[0].data.push(totalROI);
        revenueChart.update('none');

        setTimeout(() => syncStatus.classList.remove('sync-active'), 2000);
    }

    init();
</script>
</body>
                                                   </html>

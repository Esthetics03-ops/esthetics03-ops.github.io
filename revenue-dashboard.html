<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Esthetics Hub — Revenue Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--muted:#666;--accent:#16a34a;--blue:#2563eb;--amber:#f59e0b}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; margin:0; padding:20px; background:var(--bg)}
    .wrap{max-width:1200px;margin:0 auto}
    .card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.06);margin-bottom:12px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .metric{flex:1 1 220px}
    .small{color:var(--muted);font-size:13px}
    .status{position:fixed;right:14px;bottom:14px;background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:999}
    button{padding:8px 14px;border-radius:8px;border:none;font-weight:700;cursor:pointer}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:6px 8px;border-bottom:1px solid #eee}
    canvas{background:var(--card);border-radius:10px;padding:8px}
    pre{background:#f3f4f6;padding:10px;border-radius:8px;overflow:auto}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>The Esthetics Hub — Revenue Dashboard</h1>
    <div class="card">
      <button id="toggleLive" style="background:var(--blue);color:#fff">Switch to Real-time Live</button>
      <span style="margin-left:12px;color:var(--muted)" id="modeNote">(Simulated by default)</span>
    </div>

    <div id="main" class="card">
      <div id="systemStatus" class="small">Updating…</div>
      <div class="row" style="margin-top:12px;">
        <div class="card metric">
          <div class="small">AdSense — Today</div>
          <div id="adsense_earn" style="font-size:20px;font-weight:700">$0.00</div>
        </div>
        <div class="card metric">
          <div class="small">Affiliate — Today</div>
          <div id="affiliate_earn" style="font-size:20px;font-weight:700">$0.00</div>
        </div>
        <div class="card metric">
          <div class="small">Donations</div>
          <div id="donations_earn" style="font-size:20px;font-weight:700">$0.00</div>
        </div>
      </div>

      <section style="margin-top:14px;">
        <h3>Charts & Trends</h3>
        <canvas id="ga4Chart" height="150"></canvas>
        <canvas id="revenueChart" height="150" style="margin-top:16px;"></canvas>
      </section>

      <section style="margin-top:14px;">
        <h3>Top Performing Articles</h3>
        <table>
          <thead><tr><th>Title</th><th>Pageviews</th><th>Revenue</th><th>Avg Duration</th></tr></thead>
          <tbody id="topArticles"></tbody>
        </table>
      </section>

      <section style="margin-top:14px;">
        <h3>Detailed JSON</h3>
        <pre id="detail">{}</pre>
      </section>
    </div>

    <div id="statusBox" class="status">Loading…</div>
  </div>

  <script>
    const PROXY_URL = "https://the-esthetics-hub-proxy.workers.dev"; // your deployed worker
    const els = id => document.getElementById(id);
    const money = v => "$" + (typeof v === "number" ? v.toFixed(2) : "0.00");
    let isLiveMode = false;

    const toggleBtn = els('toggleLive');
    toggleBtn.addEventListener('click', () => {
      isLiveMode = !isLiveMode;
      toggleBtn.textContent = isLiveMode ? 'Switch to Simulated Mode' : 'Switch to Real-time Live';
      els('modeNote').textContent = isLiveMode ? '(Fetching live from serverless proxy)' : '(Simulated by default)';
      renderDashboard();
    });

    let SIM = {
      GA4:[{id:'G-QCX3G9KSPC',desc:'Main',activeUsers:100,pageviews:500},{id:'G-PSW1MY7HB4',desc:'Blog',activeUsers:80,pageviews:400}],
      ADSENSE:{earnings:14.37},
      AFFILIATE:{earnings:26.55},
      DONATIONS:{total:0},
      TOP_ARTICLES:[
        {title:'5 Ways to Boost Wellness',pageviews:312,revenue:5.20,avgDuration:'3m 15s'},
        {title:'Nutrition Tips for Longevity',pageviews:268,revenue:4.75,avgDuration:'2m 58s'}
      ]
    };

    let ga4Chart,revenueChart;

    function initCharts() {
      ga4Chart = new Chart(els('ga4Chart').getContext('2d'),{
        type:'line',
        data:{labels:['Now-4','Now-3','Now-2','Now-1','Now'],datasets:SIM.GA4.map((s,i)=>({label:s.desc,data:[s.activeUsers-5,s.activeUsers-3,s.activeUsers-2,s.activeUsers,s.activeUsers+2],borderColor:i?'#2563eb':'#16a34a',fill:false,tension:0.3}))},
        options:{responsive:true,plugins:{title:{display:true,text:'Active Users'}}}
      });

      revenueChart = new Chart(els('revenueChart').getContext('2d'),{
        type:'bar',
        data:{labels:['AdSense','Affiliate','Donations'],datasets:[{label:'Revenue',data:[SIM.ADSENSE.earnings,SIM.AFFILIATE.earnings,SIM.DONATIONS.total]}]},
        options:{responsive:true,plugins:{title:{display:true,text:'Revenue Distribution'}}}
      });
    }

    async function fetchLive() {
      try {
        const res = await fetch(PROXY_URL);
        const data = await res.json();
        return data;
      } catch(e) { console.warn("Live fetch failed:", e); return null; }
    }

    async function renderDashboard() {
      els('systemStatus').textContent = 'Updating…'+new Date().toLocaleTimeString();
      let dataSource = 'SIMULATED';

      if(isLiveMode){
        const live = await fetchLive();
        if(live){
          SIM = live;
          dataSource = 'LIVE';
        } else dataSource = 'SIMULATED (live unreachable)';
      }

      els('adsense_earn').textContent = money(SIM.ADSENSE.earnings);
      els('affiliate_earn').textContent = money(SIM.AFFILIATE.earnings);
      els('donations_earn').textContent = money(SIM.DONATIONS.total);

      // Top articles
      const tb = els('topArticles');
      tb.innerHTML = '';
      SIM.TOP_ARTICLES.forEach(a=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${a.title}</td><td>${a.pageviews}</td><td>${money(a.revenue)}</td><td>${a.avgDuration}</td>`;
        tb.appendChild(tr);
      });

      // JSON panel
      els('detail').textContent = JSON.stringify({timestamp:new Date().toISOString(),source:dataSource,sim:SIM},null,2);

      // Update charts
      ga4Chart.data.datasets.forEach((d,i)=>{
        d.data=[SIM.GA4[i].activeUsers-4,SIM.GA4[i].activeUsers-2,SIM.GA4[i].activeUsers-1,SIM.GA4[i].activeUsers,SIM.GA4[i].activeUsers+2];
      });
      ga4Chart.update();
      revenueChart.data.datasets[0].data = [SIM.ADSENSE.earnings,SIM.AFFILIATE.earnings,SIM.DONATIONS.total];
      revenueChart.update();
    }

    initCharts();
    renderDashboard();
    setInterval(renderDashboard,10000); // auto-refresh every 10s
  </script>
</body>
  </html>

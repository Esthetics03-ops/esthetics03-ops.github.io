<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Sync | Elite Revenue Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=pub-1959507280210179" crossorigin="anonymous"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QCX3G9KSPC"></script>
    
    <style>
        :root {
            --primary: #2d5a27;
            --accent: #b721ff;
            --glass: rgba(255, 255, 255, 0.1);
            --bg: #0f172a;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin:0; background: var(--bg); 
            color: white; overflow-x: hidden;
        }

        /* Glassmorphism Layout */
        .glass-container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 2rem;
            margin: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .stat-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.1); }

        .stat-label { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.8rem; font-weight: 800; margin: 5px 0; color: #f8fafc; }

        /* Chart Styling */
        .chart-box { background: rgba(15, 23, 42, 0.5); padding: 20px; border-radius: 20px; }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            background: var(--primary);
            color: #fff;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .syncing { animation: pulse 1.5s infinite; }
    </style>
</head>
<body>

<main class="glass-container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
        <h2>Financial Intelligence <span id="sync-indicator" class="status-badge">Live</span></h2>
        <div style="text-align:right">
            <small style="color:#94a3b8">Last Sync</small><br>
            <span id="last-updated">--:--:--</span>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="stat-card">
            <span class="stat-label">Google AdSense (Est.)</span>
            <div id="adsense-earnings" class="stat-value">$0.00</div>
            <small style="color:#28a745">Next Payout: Jan 21</small>
        </div>
        <div class="stat-card">
            <span class="stat-label">Affiliate Revenue</span>
            <div id="affiliate-earnings" class="stat-value">$0.00</div>
            <small style="color:#28a745">3 Active Streams</small>
        </div>
        <div class="stat-card" style="border-left: 4px solid var(--accent)">
            <span class="stat-label">Total Impact</span>
            <div id="total-earnings" class="stat-value">$0.00</div>
            <small>Combined Monthly ROI</small>
        </div>
    </div>

    <div class="chart-box">
        <canvas id="revenueChart" height="120"></canvas>
    </div>
</main>

<script>
    // Configuration
    const API_URL = 'https://api.estheticshub.live/monetisation'; // Replace with your actual backend
    
    // Initialize Chart.js
    const ctx = document.getElementById('revenueChart').getContext('2d');
    const revenueChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Real-time Revenue ($)',
                data: [],
                borderColor: '#b721ff',
                backgroundColor: 'rgba(183, 33, 255, 0.1)',
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
            }
        }
    });

    async function syncData() {
        const indicator = document.getElementById('sync-indicator');
        indicator.classList.add('syncing');
        
        try {
            // In live, replace this with: const res = await fetch(API_URL);
            // Simulation for visual testing:
            const mockData = {
                adsense: (Math.random() * 50 + 300).toFixed(2),
                affiliate: (Math.random() * 20 + 450).toFixed(2),
                total: 0
            };
            mockData.total = (parseFloat(mockData.adsense) + parseFloat(mockData.affiliate)).toFixed(2);

            // Update UI
            document.getElementById('adsense-earnings').innerText = `$${mockData.adsense}`;
            document.getElementById('affiliate-earnings').innerText = `$${mockData.affiliate}`;
            document.getElementById('total-earnings').innerText = `$${mockData.total}`;
            document.getElementById('last-updated').innerText = new Date().toLocaleTimeString();

            // Update Chart
            updateChart(mockData.total);

        } catch (err) {
            console.error("Sync Error:", err);
        } finally {
            setTimeout(() => indicator.classList.remove('syncing'), 1000);
        }
    }

    function updateChart(value) {
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if(revenueChart.data.labels.length > 8) {
            revenueChart.data.labels.shift();
            revenueChart.data.datasets[0].data.shift();
        }
        revenueChart.data.labels.push(time);
        revenueChart.data.datasets[0].data.push(value);
        revenueChart.update();
    }

    // Start Lifecycle
    window.onload = () => {
        syncData();
        setInterval(syncData, 30000); // 30s Refresh
    };
</script>
</body>
              </html>

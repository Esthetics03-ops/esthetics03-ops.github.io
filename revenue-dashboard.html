<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Sync | 2026 Intelligence Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary: #2d5a27;
            --accent: #b721ff;
            --bg: #030712;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: radial-gradient(circle at top right, #1e1b4b, #030712);
            color: #f8fafc; 
            margin: 0; 
            min-height: 100vh;
            padding: 24px;
        }

        .dashboard-wrapper { max-width: 1400px; margin: 0 auto; }

        /* Liquid Glass UI */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            padding: 1.8rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover { 
            transform: translateY(-8px); 
            border-color: var(--accent);
            background: rgba(255,255,255,0.08); 
        }

        .label { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; letter-spacing: 1.5px; }
        .value { font-size: 2.5rem; font-weight: 900; margin: 12px 0; color: #fff; text-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(183, 33, 255, 0.15);
            border-radius: 50px;
            font-size: 0.85rem;
            color: #d8b4fe;
            border: 1px solid rgba(183, 33, 255, 0.3);
        }

        .chart-box { height: 350px; margin-top: 2rem; }

        /* Progress Bar Enhancements */
        .progress-track { height: 8px; background: #1e293b; border-radius: 10px; margin-top: 15px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #b721ff, #21d4fd); transition: width 1s ease-in-out; }

        @keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .sync-active::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: scan 2s linear infinite;
        }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <header style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:3rem; padding: 0 10px;">
        <div>
            <h1 style="margin:0; font-size: 2rem; font-weight: 900; letter-spacing: -1px;">Bio-Sync <span style="color:var(--accent)">Ops</span></h1>
            <div class="status-pill" id="sync-status">
                <i class="bi bi-cpu-fill"></i> <span id="sync-text">System Active</span>
            </div>
        </div>
        <div style="text-align:right">
            <span class="label">Telemetry Sync</span><br>
            <span id="timestamp" style="font-weight:700; color:var(--accent);">--:--:--</span>
        </div>
    </header>

    <div class="stats-grid">
        <div class="card">
            <span class="label">AdSense Intelligence</span>
            <span id="adsense-val" class="value">$0.00</span>
            <div class="progress-track"><div id="progress-bar" class="progress-fill" style="width: 0%"></div></div>
            <div style="display:flex; justify-content:space-between; margin-top:10px;">
                <small style="color:#94a3b8">Threshold: $100</small>
                <small id="payout-status" style="color:var(--accent)">Checking...</small>
            </div>
        </div>

        <div class="card">
            <span class="label">Affiliate Velocity</span>
            <span id="affiliate-val" class="value">$0.00</span>
            <div style="margin-top:15px; display:flex; gap:10px;">
                <span class="status-pill" style="background:rgba(74, 222, 128, 0.1); color:#4ade80; border-color:rgba(74, 222, 128, 0.2)">
                    Oura: Active
                </span>
                <span class="status-pill" style="background:rgba(56, 189, 248, 0.1); color:#38bdf8; border-color:rgba(56, 189, 248, 0.2)">
                    Thrive: Ready
                </span>
            </div>
        </div>

        <div class="card" style="background: linear-gradient(135deg, rgba(183, 33, 255, 0.15), transparent);">
            <span class="label">Total ROI Forecast</span>
            <span id="total-val" class="value" style="color:#fff;">$0.00</span>
            <small style="color:#94a3b8"><i class="bi bi-lightning-charge-fill"></i> Jan 21 Payout: <span id="payout-ready" style="color:#fff">--</span></small>
        </div>
    </div>

    <div class="glass-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="label">Revenue Trajectory (60s Intervals)</span>
            <div id="active-properties" style="font-size:0.7rem; color:#64748b;">Properties: G-QCX3G9KSPC, G-PSW1MY7HB4</div>
        </div>
        <div class="chart-box">
            <canvas id="revenueChart"></canvas>
        </div>
    </div>
</div>

<script>
    let revenueChart;
    let config = {};

    async function init() {
        try {
            const response = await fetch('config.json');
            config = await response.json();
            
            // Handle Multiple GA4 properties visually
            const propList = config.GA4_PROPERTIES ? config.GA4_PROPERTIES.join(', ') : 'Primary';
            document.getElementById('active-properties').innerText = `Active Properties: ${propList}`;
            
            setupChart();
            startSyncLoop();
        } catch (err) {
            console.error("Dashboard Offline:", err);
            document.getElementById('sync-text').innerText = "Simulated Mode";
            setupChart();
            startSyncLoop();
        }
    }

    function setupChart() {
        const ctx = document.getElementById('revenueChart').getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(183, 33, 255, 0.4)');
        gradient.addColorStop(1, 'rgba(183, 33, 255, 0)');

        revenueChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Live Yield',
                    data: [],
                    borderColor: '#b721ff',
                    borderWidth: 3,
                    backgroundColor: gradient,
                    fill: true,
                    tension: 0.5,
                    pointRadius: 0,
                    pointHitRadius: 20
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 2000, easing: 'easeOutQuart' },
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#475569', font: { size: 10 } } },
                    y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#475569' } }
                }
            }
        });
    }

    async function startSyncLoop() {
        const syncAction = async () => {
            const syncIcon = document.getElementById('sync-status');
            syncIcon.classList.add('sync-active');
            
            // Logic: In Production, combine data from multiple GA4 sources
            const adsense = (Math.random() * 2 + 91.40).toFixed(2);
            const affiliate = (Math.random() * 1.5 + 145.20).toFixed(2);
            const total = (parseFloat(adsense) + parseFloat(affiliate)).toFixed(2);

            // Update DOM
            document.getElementById('adsense-val').innerText = `$${adsense}`;
            document.getElementById('affiliate-val').innerText = `$${affiliate}`;
            document.getElementById('total-val').innerText = `$${total}`;
            document.getElementById('timestamp').innerText = new Date().toLocaleTimeString();

            // Payout Logic (Aggregated)
            const threshold = config.PAYMENT_THRESHOLD || 100;
            const progress = (adsense / threshold) * 100;
            document.getElementById('progress-bar').style.width = `${Math.min(progress, 100)}%`;
            document.getElementById('payout-status').innerText = adsense >= threshold ? "Threshold Met" : `${Math.round(100-progress)}% To Go`;
            document.getElementById('payout-ready').innerText = adsense >= threshold ? "CONFIRMED" : "PENDING";

            // Update Chart with Real-time Decimation
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            if(revenueChart.data.labels.length > 20) {
                revenueChart.data.labels.shift();
                revenueChart.data.datasets[0].data.shift();
            }
            revenueChart.data.labels.push(now);
            revenueChart.data.datasets[0].data.push(total);
            revenueChart.update('none'); // Update without full re-animation for performance

            setTimeout(() => syncIcon.classList.remove('sync-active'), 1500);
        };

        syncAction();
        setInterval(syncAction, 60000); // 1-minute sync for efficiency
    }

    init();
</script>
</body>
</html>

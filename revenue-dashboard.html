<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Esthetics Hub - Revenue Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f4f4f4;}
header{background:#222;color:#fff;padding:1rem;text-align:center;}
main{padding:1rem;max-width:1200px;margin:auto;}
h2{margin-top:2rem;margin-bottom:1rem;}
.dashboard-section{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem;}
.metric-card,.config-item,.status-card{background:#fff;padding:1rem;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.metric-label{font-weight:bold;margin-bottom:0.5rem;}
.metric-value{font-size:1.5rem;color:#333;}
footer{text-align:center;padding:1rem;background:#222;color:#fff;margin-top:2rem;}
canvas{background:#fff;border-radius:8px;padding:1rem;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
</style>
</head>
<body>
<header>
<h1>The Esthetics Hub Revenue Dashboard</h1>
</header>

<main>
<section id="config-section" class="dashboard-section">
  <div class="status-card config-item"><span class="label">API Key</span><span class="value" id="api-key-status">Loading...</span></div>
  <div class="status-card config-item"><span class="label">GA4 Properties</span><span class="value" id="ga4-properties-status">Loading...</span></div>
</section>

<section id="live-metrics-section" class="dashboard-section">
  <div class="metric-card"><p class="metric-label">Real-Time Users</p><p class="metric-value" id="real-time-users">-</p></div>
  <div class="metric-card"><p class="metric-label">Visits Today</p><p class="metric-value" id="daily-visits">-</p></div>
</section>

<section id="monetization-section" class="dashboard-section">
  <div class="metric-card"><p class="metric-label">AdSense (Today)</p><p class="metric-value" id="adsense-today">-</p></div>
  <div class="metric-card"><p class="metric-label">Estimated Earnings (Month)</p><p class="metric-value" id="adsense-month">-</p></div>
  <div class="metric-card"><p class="metric-label">Affiliate Earnings</p><p class="metric-value" id="affiliate-earnings">-</p></div>
</section>

<section>
<h2>Revenue & Visits Overview</h2>
<canvas id="revenueChart" height="150"></canvas>
</section>
</main>

<footer>&copy; 2025 The Esthetics Hub</footer>

<script>
let CONFIG={};
const ctx=document.getElementById('revenueChart').getContext('2d');
const revenueChart=new Chart(ctx,{type:'line',data:{labels:[],datasets:[
{label:'Visits',data:[],borderColor:'#007bff',backgroundColor:'rgba(0,123,255,0.2)',fill:true,tension:0.4},
{label:'Revenue ($)',data:[],borderColor:'#28a745',backgroundColor:'rgba(40,167,69,0.2)',fill:true,tension:0.4}
]},options:{responsive:true,plugins:{legend:{position:'top'}},scales:{x:{title:{display:true,text:'Time'}},y:{title:{display:true,text:'Value'},beginAtZero:true}}}});

function addChartData(visits,revenue){
  const now=new Date();
  const timeLabel=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  if(revenueChart.data.labels.length>=10){
    revenueChart.data.labels.shift();
    revenueChart.data.datasets[0].data.shift();
    revenueChart.data.datasets[1].data.shift();
  }
  revenueChart.data.labels.push(timeLabel);
  revenueChart.data.datasets[0].data.push(visits);
  revenueChart.data.datasets[1].data.push(revenue);
  revenueChart.update();
}

async function loadConfig(){
  try{
    const res=await fetch('/config.json');
    CONFIG=await res.json();
    document.getElementById('api-key-status').textContent="Loaded ✅";
    document.getElementById('ga4-properties-status').textContent=`${CONFIG.GA4_PROPERTIES.length} Properties ✅`;
  }catch(err){console.error(err);}
}

async function updateMetrics(){
  try{
    const res=await fetch('/api/metrics');
    const data=await res.json();
    document.getElementById('real-time-users').textContent=data.ga4.activeUsers;
    document.getElementById('daily-visits').textContent=data.ga4.dailyVisits;
    document.getElementById('adsense-today').textContent=`$${data.adsense.today}`;
    document.getElementById('adsense-month').textContent=`$${data.adsense.month}`;
    document.getElementById('affiliate-earnings').textContent=`$${data.affiliate.total}`;
    addChartData(data.ga4.dailyVisits,parseFloat(data.adsense.today)+parseFloat(data.affiliate.total));
  }catch(err){console.error(err);}
}

async function initDashboard(){
  await loadConfig();
  await updateMetrics();
  setInterval(updateMetrics,60000);
}
document.addEventListener('DOMContentLoaded',initDashboard);
</script>

</body>
  </html>

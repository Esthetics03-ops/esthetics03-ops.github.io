<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Esthetics Hub Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="metrics.js" defer></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
  h1 { text-align: center; }
  .metrics { display: flex; justify-content: space-around; margin-bottom: 20px; flex-wrap: wrap; }
  .metric-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); width: 30%; text-align: center; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-top: 20px; }
  th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
  th { background: #4CAF50; color: white; }
  canvas { margin-top: 30px; }
</style>
</head>
<body>
<h1>The Esthetics Hub Dashboard</h1>

<div class="metrics">
  <div class="metric-card">
    <h2>Total Active Users</h2>
    <p id="totalUsers">0</p>
  </div>
  <div class="metric-card">
    <h2>Total Ad Revenue</h2>
    <p id="totalAdRevenue">$0.00</p>
  </div>
  <div class="metric-card">
    <h2>Total Affiliate Revenue</h2>
    <p id="totalAffiliateRevenue">$0.00</p>
  </div>
</div>

<h2>Page-Level Metrics</h2>
<table>
  <thead>
    <tr>
      <th>Page</th>
      <th>Active Users</th>
      <th>Ad Revenue</th>
      <th>Affiliate Revenue</th>
      <th>Ad RPM</th>
      <th>Affiliate Clicks</th>
    </tr>
  </thead>
  <tbody id="pagesTableBody">
  </tbody>
</table>

<h2>Device Breakdown</h2>
<canvas id="deviceChart" height="100"></canvas>

<h2>Traffic Source Breakdown</h2>
<canvas id="sourceChart" height="100"></canvas>

<script>
function renderDashboard() {
  // Overall metrics
  document.getElementById('totalUsers').innerText = dashboardData.totals.activeUsers;
  document.getElementById('totalAdRevenue').innerText = '$' + dashboardData.totals.adRevenue;
  document.getElementById('totalAffiliateRevenue').innerText = '$' + dashboardData.totals.affiliateRevenue;

  // Page-level table
  const tableBody = document.getElementById('pagesTableBody');
  tableBody.innerHTML = '';
  dashboardData.pages.forEach(p => {
    const row = `<tr>
      <td>${p.name}</td>
      <td>${p.activeUsers}</td>
      <td>$${p.adRevenue}</td>
      <td>$${p.affiliateRevenue}</td>
      <td>${p.adRPM}</td>
      <td>${p.affiliateClicks}</td>
    </tr>`;
    tableBody.innerHTML += row;
  });

  // Device chart
  const ctxDevice = document.getElementById('deviceChart').getContext('2d');
  if(window.deviceChart) window.deviceChart.destroy();
  window.deviceChart = new Chart(ctxDevice, {
    type: 'pie',
    data: {
      labels: dashboardData.devices.map(d => d.device),
      datasets: [{ data: dashboardData.devices.map(d => d.users), backgroundColor: ['#4CAF50','#FF9800','#2196F3'] }]
    }
  });

  // Traffic source chart
  const ctxSource = document.getElementById('sourceChart').getContext('2d');
  if(window.sourceChart) window.sourceChart.destroy();
  window.sourceChart = new Chart(ctxSource, {
    type: 'pie',
    data: {
      labels: dashboardData.sources.map(s => s.source),
      datasets: [{ data: dashboardData.sources.map(s => s.users), backgroundColor: ['#4CAF50','#FF9800','#2196F3','#FFC107','#9C27B0'] }]
    }
  });
}
</script>
</body>
  </html>

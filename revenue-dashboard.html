<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Sync | Live Operations Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary: #2d5a27; --accent: #b721ff; --secondary: #21d4fd;
            --bg: #030712; --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1); --success: #4ade80; --danger: #ff4b2b;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: radial-gradient(circle at top left, #1e1b4b 0%, #030712 100%);
            color: #f8fafc; margin: 0; min-height: 100vh; overflow-x: hidden;
        }

        #lock-screen {
            position: fixed; inset: 0; z-index: 9999; background: var(--bg);
            display: flex; align-items: center; justify-content: center; transition: 0.8s;
        }

        .dashboard-wrapper { width: 100%; max-width: 1400px; margin: 0 auto; padding: 20px; display: none; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 25px; }
        
        .card {
            background: var(--glass); border: 1px solid var(--border);
            padding: 2rem; border-radius: 24px; backdrop-filter: blur(10px);
            transition: 0.3s ease;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .value { font-size: 2.2rem; font-weight: 900; color: #fff; margin: 10px 0; font-variant-numeric: tabular-nums; }
        .label { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; }

        .chart-panel { background: var(--glass); border: 1px solid var(--border); border-radius: 30px; padding: 2rem; margin-top: 20px; }
        .chart-container { height: 350px; position: relative; }

        .status-pill { padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; background: rgba(74, 222, 128, 0.1); color: var(--success); }
        .sync-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div style="text-align: center; background: var(--glass); padding: 3rem; border-radius: 30px; border: 1px solid var(--border);">
            <i class="bi bi-shield-lock" style="font-size: 3rem; color: var(--accent);"></i>
            <h2>System Authorization</h2>
            <input type="password" id="pass" placeholder="••••" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: #fff; padding: 15px; border-radius: 12px; text-align: center; font-size: 1.5rem; width: 100%; margin: 20px 0;">
            <button onclick="unlock()" style="width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-weight: 800; cursor: pointer;">ACCESS NODE</button>
        </div>
    </div>

    <div class="dashboard-wrapper" id="dash">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div>
                <h1 style="margin:0;">Ops Intelligence <span style="color: var(--accent);">Live</span></h1>
                <span class="status-pill"><i class="bi bi-broadcast sync-pulse"></i> NODE: GITHUB-PAGES-SVR</span>
            </div>
            <div style="text-align: right;">
                <h2 id="clock" style="margin:0; font-family: monospace; color: var(--secondary);">00:00:00</h2>
                <small id="last-sync" style="color: #64748b;">Syncing...</small>
            </div>
        </header>

        <div class="stats-grid">
            <div class="card"><span class="label">Total Revenue</span><div id="stat-revenue" class="value">$0.00</div></div>
            <div class="card"><span class="label">Conversions</span><div id="stat-conv" class="value">0</div></div>
            <div class="card"><span class="label">Network Latency</span><div id="stat-latency" class="value">0ms</div></div>
            <div class="card"><span class="label">Click Efficiency</span><div id="stat-ctr" class="value">0.0%</div></div>
        </div>

        <div class="chart-panel">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <span class="label">Performance Trajectory</span>
                <span id="trend" style="color: var(--success); font-weight: 800;"><i class="bi bi-graph-up"></i> +12.5%</span>
            </div>
            <div class="chart-container">
                <canvas id="mainChart"></canvas>
            </div>
        </div>
    </div>

<script>
    let mainChart;
    const AUTH_KEY = "1234";

    function unlock() {
        if(document.getElementById('pass').value === AUTH_KEY) {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('dash').style.display = 'block';
            init();
        }
    }

    async function syncData() {
        try {
            // Error Fix: Added cache-busting timestamp to bypass GitHub Pages CDN cache
            const response = await fetch(`./config.json?t=${Date.now()}`);
            if (!response.ok) throw new Error('Data Source Unavailable');
            
            const data = await response.json();

            // Accurate Number Update
            if(data.trackers) {
                data.trackers.forEach(t => {
                    const el = document.getElementById(t.id);
                    if(el) {
                        const val = typeof t.value === 'number' ? t.value : parseFloat(t.value.replace(/[^0-9.]/g, ''));
                        el.innerText = `${t.prefix || ''}${val.toLocaleString()}${t.suffix || ''}`;
                    }
                });
            }

            // Chart Update
            if(data.chartData && mainChart) {
                mainChart.data.labels = data.chartData.labels;
                mainChart.data.datasets[0].data = data.chartData.points;
                mainChart.update();
            }

            document.getElementById('last-sync').innerText = `Synced: ${new Date().toLocaleTimeString()}`;
        } catch (err) {
            console.error("Dashboard Sync Error:", err);
            document.getElementById('last-sync').innerText = "Sync Failed: Reconnecting...";
        }
    }

    function init() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        mainChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    data: [],
                    borderColor: '#b721ff',
                    borderWidth: 4,
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(183, 33, 255, 0.1)',
                    pointRadius: 4,
                    pointBackgroundColor: '#21d4fd'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#64748b' } },
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } }
                }
            }
        });

        syncData();
        setInterval(syncData, 15000); // 15s Cycle
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);
    }
</script>
</body>
    </html>

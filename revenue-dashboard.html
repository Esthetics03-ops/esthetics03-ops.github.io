<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Esthetics Hub - Revenue Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-7xl mx-auto p-6">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">Revenue & Payout Dashboard</h1>
      <button id="refreshBtn" class="px-3 py-2 bg-blue-600 text-white rounded">Refresh</button>
    </header>

    <div id="status" class="mb-4 text-sm text-gray-600">Status: <span id="statusText">Initializing...</span></div>

    <div class="grid md:grid-cols-3 gap-4">
      <!-- Payout Summary -->
      <div class="bg-white p-4 rounded shadow">
        <h2 class="font-semibold">Payout Summary</h2>
        <div id="streamsList" class="mt-3 space-y-2"></div>
        <div class="mt-4 border-t pt-2 flex justify-between">
          <div><strong>Total</strong></div>
          <div><strong id="totalAmount">$0.00</strong></div>
        </div>
        <div class="mt-2 text-sm text-gray-600">
          Available: <span id="availableAmount">$0.00</span> • Pending: <span id="pendingAmount">$0.00</span>
        </div>
      </div>

      <!-- Revenue Chart -->
      <div class="bg-white p-4 rounded shadow md:col-span-2">
        <h2 class="font-semibold">Revenue Chart</h2>
        <canvas id="revenueChart" width="600" height="300"></canvas>
      </div>

      <!-- Upcoming Payouts -->
      <div class="bg-white p-4 rounded shadow md:col-span-3">
        <h2 class="font-semibold">Upcoming Payments</h2>
        <ul id="upcomingList" class="mt-3 space-y-2"></ul>
      </div>
    </div>

    <!-- Logs -->
    <div class="mt-6">
      <h3 class="font-semibold">Debug / Logs</h3>
      <pre id="log" class="bg-black text-green-200 p-3 rounded h-40 overflow-auto"></pre>
    </div>
  </div>

  <script>
    // Config placeholders
    const CONFIG = {
      GOOGLE_API_KEY: "AIzaSyD-LIVE-PLACEHOLDER-12345",
      GA4_PROPERTIES: ["G-QCX3G9KSPC","G-PSW1MY7HB4"],
      ADSENSE_PUB_ID: "pub-1959507280210179",
      AFFILIATE_ID: "esthetics-hub-affiliate",
      MPESA_STK_ENDPOINT: "/api/mpesa-stk"
    };

    const logEl = document.getElementById('log');
    function log(msg){ console.log(msg); if(logEl) logEl.textContent += '\\n'+msg; }

    let chart;

    // Simulated or backend fetch summary
    async function fetchSummary() {
      try {
        const res = await fetch('/api/summary');
        if(!res.ok) throw new Error('Backend summary failed: '+res.status);
        return await res.json();
      } catch (e) {
        log('Backend fetch failed, using simulated data');
        const streams = [
          {name:'AdSense',amount:123.45,payoutDate:'2025-11-21',paymentMethod:'Bank Transfer'},
          {name:'Amazon Affiliate',amount:67.89,payoutDate:'2026-01-31',paymentMethod:'Direct Deposit / Gift Card / Check'},
          {name:'Booking.com Affiliate',amount:45.67,payoutDate:'2025-12-01',paymentMethod:'Bank Transfer'},
          {name:'PayPal Donations',amount:34.56,payoutDate:'pending',paymentMethod:'PayPal Account'},
          {name:'M-Pesa Donations',amount:23.45,payoutDate:'pending',paymentMethod:'M-Pesa Mobile Account'}
        ];
        const total = streams.reduce((s,i)=>s+i.amount,0);
        return { streams, total, available:0, pending:total, payments:streams.map(s=>({stream:s.name,date:s.payoutDate,amount:s.amount,method:s.paymentMethod})) };
      }
    }

    function renderChart(streams) {
      const ctx = document.getElementById('revenueChart').getContext('2d');
      const labels = streams.map(s=>s.name);
      const data = streams.map(s=>s.amount);
      if(chart) chart.destroy();
      chart = new Chart(ctx, {
        type:'bar',
        data:{labels,datasets:[{label:'Amount (USD)',data}]},
        options:{responsive:true,maintainAspectRatio:false}
      });
    }

    function renderSummary(data) {
      const list = document.getElementById('streamsList'); list.innerHTML='';
      data.streams.forEach(s=>{
        const div = document.createElement('div'); div.className='flex justify-between';
        div.innerHTML = `<div><strong>${s.name}</strong><div class="text-xs text-gray-500">${s.paymentMethod}</div></div><div>$${s.amount.toFixed(2)}</div>`;
        list.appendChild(div);
      });
      document.getElementById('totalAmount').textContent = '$'+data.total.toFixed(2);
      document.getElementById('availableAmount').textContent = '$'+(data.available||0).toFixed(2);
      document.getElementById('pendingAmount').textContent = '$'+(data.pending||0).toFixed(2);

      renderChart(data.streams);

      const ul = document.getElementById('upcomingList'); ul.innerHTML='';
      data.payments.forEach(p=>{
        const li = document.createElement('li'); li.className='flex justify-between';
        li.textContent = `${p.stream} — ${p.method}`;
        const span = document.createElement('span'); span.className='text-sm text-gray-600'; span.textContent = p.date;
        li.appendChild(span);
        ul.appendChild(li);
      });
    }

    async function refresh() {
      document.getElementById('statusText').textContent='Refreshing...';
      try {
        const data = await fetchSummary();
        renderSummary(data);
        document.getElementById('statusText').textContent = 'OK (last updated '+new Date().toLocaleTimeString()+')';
        log('Dashboard refreshed');
      } catch(e){
        document.getElementById('statusText').textContent='Error: '+e.message;
        log(e.stack);
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', refresh);
    window.addEventListener('load',()=>{refresh(); setInterval(refresh,60000);});
  </script>
</body>
      </html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Sync | Master Admin 2026</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary: #2d5a27; --accent: #b721ff; --secondary: #21d4fd;
            --bg: #030712; --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1); --success: #4ade80; --danger: #ff4b2b;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: radial-gradient(circle at top left, #1e1b4b 0%, #030712 100%);
            color: #f8fafc; margin: 0; min-height: 100vh; overflow-x: hidden;
        }

        /* Lock Screen */
        #lock-screen {
            position: fixed; inset: 0; z-index: 9999; background: var(--bg);
            display: flex; align-items: center; justify-content: center; transition: 0.8s;
        }

        /* Layout */
        .dashboard-wrapper { width: 100%; max-width: 1400px; margin: 0 auto; padding: 25px; display: none; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 25px; }
        
        .card {
            background: var(--glass); border: 1px solid var(--border);
            padding: 1.8rem; border-radius: 28px; backdrop-filter: blur(15px);
            transition: 0.3s ease; position: relative; overflow: hidden;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .value { font-size: 2.4rem; font-weight: 900; color: #fff; margin: 8px 0; font-variant-numeric: tabular-nums; }
        .label { color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }

        .layout-split { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1100px) { .layout-split { grid-template-columns: 2fr 1fr; } }

        /* Trending List */
        .trending-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--border);
        }
        .trending-item:last-child { border: none; }

        /* Progress Bar */
        .progress-container { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-top: 10px; overflow: hidden; }
        #threshold-bar { height: 100%; background: var(--accent); width: 0%; transition: 1.5s ease; box-shadow: 0 0 10px var(--accent); }

        .sync-pulse { color: var(--success); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div style="text-align: center; background: var(--glass); padding: 3.5rem; border-radius: 35px; border: 1px solid var(--border); max-width: 400px; width: 90%;">
            <i class="bi bi-fingerprint" style="font-size: 4rem; color: var(--accent);"></i>
            <h2 style="letter-spacing: -1px;">Bio-Sync Auth</h2>
            <input type="password" id="pass" placeholder="••••" maxlength="4" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: #fff; padding: 18px; border-radius: 15px; text-align: center; font-size: 1.8rem; width: 100%; margin: 25px 0; letter-spacing: 10px;">
            <button onclick="unlock()" style="width: 100%; padding: 18px; border-radius: 15px; border: none; background: var(--accent); color: #fff; font-weight: 900; cursor: pointer; letter-spacing: 1px;">INITIALIZE NODE</button>
        </div>
    </div>

    <div class="dashboard-wrapper" id="dash">
        <header style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 35px;">
            <div>
                <h1 style="margin:0; font-size: 2.5rem; letter-spacing: -1.5px;">ESTHETICS <span style="color: var(--accent);">HUB</span></h1>
                <span style="font-size: 0.75rem; font-weight: 800; color: #64748b;"><i class="bi bi-broadcast sync-pulse"></i> LIVE INTEL STREAM</span>
            </div>
            <div style="text-align: right;">
                <h2 id="clock" style="margin:0; font-family: 'Courier New', monospace; color: var(--secondary); font-size: 2rem;">00:00:00</h2>
                <small id="last-sync" style="color: var(--accent); font-weight: 700;">FETCHING DATA...</small>
            </div>
        </header>

        <div class="stats-grid">
            <div class="card">
                <span class="label">AdSense Earnings</span>
                <div id="stat-adsense" class="value">$0.00</div>
                <div class="progress-container"><div id="threshold-bar"></div></div>
                <small id="threshold-text" style="color: var(--accent); font-size: 0.65rem; margin-top: 5px; display: block;">0% to Threshold</small>
            </div>
            <div class="card">
                <span class="label">Affiliate Revenue</span>
                <div id="stat-affiliate" class="value">$0.00</div>
                <div id="affiliate-trend" style="color: var(--success); font-size: 0.7rem; font-weight: 800;">LIVE UPDATING</div>
            </div>
            <div class="card">
                <span class="label">Active Users</span>
                <div id="stat-active" class="value" style="color: var(--success);">0</div>
                <small style="color: #64748b;">Real-time Node Activity</small>
            </div>
            <div class="card">
                <span class="label">Expected Payout</span>
                <div id="stat-payout" class="value" style="color: var(--secondary);">$0.00</div>
                <small style="color: #64748b;">Cycle: Jan 2026</small>
            </div>
        </div>

        <div class="layout-split">
            <div class="card" style="min-height: 400px;">
                <span class="label">Engagement Trajectory</span>
                <div style="height: 350px; margin-top: 20px;">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <div class="card">
                <span class="label">Trending Intelligence</span>
                <div id="trending-list" style="margin-top: 20px;">
                    </div>
            </div>
        </div>
    </div>

<script>
    let mainChart;
    const AUTH_KEY = "1234";

    function unlock() {
        if(document.getElementById('pass').value === AUTH_KEY) {
            document.getElementById('lock-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('dash').style.display = 'block';
                init();
            }, 500);
        }
    }

    async function syncData() {
        try {
            const response = await fetch(`./config.json?v=${Date.now()}`);
            if (!response.ok) throw new Error();
            const data = await response.json();

            // 1. Update Core Trackers
            data.trackers.forEach(t => {
                const el = document.getElementById(t.id);
                if(el) {
                    const val = typeof t.value === 'number' ? t.value : 0;
                    el.innerText = `${t.prefix || ''}${val.toLocaleString(undefined, {minimumFractionDigits: 2})}${t.suffix || ''}`;
                }
            });

            // 2. Threshold Logic
            const adsense = data.trackers.find(t => t.id === 'stat-adsense').value;
            const goal = data.payout_threshold || 100;
            const pct = Math.min((adsense / goal) * 100, 100);
            document.getElementById('threshold-bar').style.width = pct + '%';
            document.getElementById('threshold-text').innerText = `${pct.toFixed(1)}% to Payout ($${goal})`;

            // 3. Trending Articles
            const trendList = document.getElementById('trending-list');
            trendList.innerHTML = data.trending_articles.map(art => `
                <div class="trending-item">
                    <span style="font-size: 0.9rem; font-weight: 600;">${art.title}</span>
                    <span style="color: var(--secondary); font-weight: 800;">${art.views}</span>
                </div>
            `).join('');

            // 4. Chart Update
            if(data.chartData && mainChart) {
                mainChart.data.labels = data.chartData.labels;
                mainChart.data.datasets[0].data = data.chartData.points;
                mainChart.update('none');
            }

            document.getElementById('last-sync').innerText = `SYNCED: ${new Date().toLocaleTimeString()}`;
        } catch (e) {
            document.getElementById('last-sync').innerText = "CONNECTION LOST";
        }
    }

    function init() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        mainChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    data: [],
                    borderColor: '#b721ff',
                    borderWidth: 4,
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(183, 33, 255, 0.1)',
                    pointRadius: 3,
                    pointBackgroundColor: '#21d4fd'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#64748b' } },
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } }
                }
            }
        });

        syncData();
        setInterval(syncData, 10000); 
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
    }
</script>
</body>
</html>

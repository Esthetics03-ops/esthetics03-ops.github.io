<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Sync | Financial Intelligence Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary: #2d5a27;
            --accent: #b721ff;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg); 
            color: white; 
            margin: 0; 
            padding: 20px;
        }

        .dashboard-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Glassmorphism UI */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 2rem;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255,255,255,0.03);
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s ease;
        }

        .card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); }

        .label { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .value { font-size: 2rem; font-weight: 800; margin: 10px 0; display: block; }
        
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(45, 90, 39, 0.2);
            border-radius: 50px;
            font-size: 0.8rem;
            color: #4ade80;
        }

        .chart-container { height: 300px; width: 100%; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .sync-active { animation: pulse 1.5s infinite; }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
        <div>
            <h1 style="margin:0; font-size: 1.5rem;">The Esthetics Hub</h1>
            <div class="status-pill" id="sync-status">
                <i class="bi bi-broadcast"></i> <span id="sync-text">Live Monitoring</span>
            </div>
        </div>
        <div style="text-align:right">
            <span class="label">Last Update</span><br>
            <span id="timestamp" style="font-weight:600;">--:--:--</span>
        </div>
    </div>

    <div class="stats-grid">
        <div class="card">
            <span class="label">AdSense Revenue (Dec 2025)</span>
            <span id="adsense-val" class="value">$0.00</span>
            <div id="payout-progress" style="height:4px; background:#334155; border-radius:2px;">
                <div id="progress-bar" style="width:0%; height:100%; background:var(--accent); border-radius:2px;"></div>
            </div>
            <small style="display:block; margin-top:8px; color:#94a3b8;">Threshold: $100.00</small>
        </div>

        <div class="card">
            <span class="label">Affiliate (Oura/Thrive)</span>
            <span id="affiliate-val" class="value">$0.00</span>
            <small style="color:#4ade80"><i class="bi bi-graph-up"></i> +12% vs last month</small>
        </div>

        <div class="card" style="background: linear-gradient(135deg, rgba(183, 33, 255, 0.1), transparent);">
            <span class="label">Total Est. Earnings</span>
            <span id="total-val" class="value" style="color:#f8fafc;">$0.00</span>
            <small style="color:#94a3b8">January Payout Ready: <span id="payout-ready">Checking...</span></small>
        </div>
    </div>

    <div class="glass-panel">
        <span class="label">Revenue Velocity (Real-Time)</span>
        <div class="chart-container">
            <canvas id="revenueChart"></canvas>
        </div>
    </div>
</div>

<script>
    let revenueChart;
    let config = {};

    // 1. Initialize Dashboard Configuration
    async function init() {
        try {
            const response = await fetch('config.json');
            config = await response.json();
            console.log("Configuration Loaded for Publisher:", config.ADSENSE_PUB_ID);
            
            setupChart();
            startSyncLoop();
        } catch (err) {
            console.error("Critical: Could not load config.json", err);
            document.getElementById('sync-text').innerText = "Offline Mode";
        }
    }

    // 2. Setup Chart.js
    function setupChart() {
        const ctx = document.getElementById('revenueChart').getContext('2d');
        revenueChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'USD/Hour',
                    data: [],
                    borderColor: '#b721ff',
                    backgroundColor: 'rgba(183, 33, 255, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#64748b' } },
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } }
                }
            }
        });
    }

    // 3. Live Sync Logic
    async function startSyncLoop() {
        const syncAction = async () => {
            document.getElementById('sync-status').classList.add('sync-active');
            
            // Simulation: In Production, replace with: await fetch(config.API_ENDPOINTS.monetization)
            const adsense = (Math.random() * 5 + 85.50).toFixed(2);
            const affiliate = (Math.random() * 2 + 120.20).toFixed(2);
            const total = (parseFloat(adsense) + parseFloat(affiliate)).toFixed(2);

            // Update UI
            document.getElementById('adsense-val').innerText = `$${adsense}`;
            document.getElementById('affiliate-val').innerText = `$${affiliate}`;
            document.getElementById('total-val').innerText = `$${total}`;
            document.getElementById('timestamp').innerText = new Date().toLocaleTimeString();

            // Payout Readiness
            const progress = (adsense / config.PAYMENT_THRESHOLD) * 100;
            document.getElementById('progress-bar').style.width = `${Math.min(progress, 100)}%`;
            document.getElementById('payout-ready').innerText = adsense >= config.PAYMENT_THRESHOLD ? "Yes ✅" : "Pending ⏳";

            // Update Chart
            const label = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if(revenueChart.data.labels.length > 15) {
                revenueChart.data.labels.shift();
                revenueChart.data.datasets[0].data.shift();
            }
            revenueChart.data.labels.push(label);
            revenueChart.data.datasets[0].data.push(total);
            revenueChart.update();

            setTimeout(() => document.getElementById('sync-status').classList.remove('sync-active'), 1000);
        };

        syncAction();
        setInterval(syncAction, 30000); // Sync every 30 seconds
    }

    init();
</script>
</body>
</html>

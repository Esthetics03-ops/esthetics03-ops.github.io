<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Esthetics Hub - Live Revenue Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: Inter, sans-serif; background:#f3f4f6; }
  .metric { font-weight:600; }
  .currency { color:#10b981; }
  .growth { font-weight:600; font-size:.9rem; }
  .growth.up { color:#10b981; }
  .growth.down { color:#ef4444; }
</style>
</head>
<body>
<section class="max-w-6xl mx-auto my-8 p-6 bg-white rounded-2xl shadow-lg">
<h1 class="text-3xl font-bold text-center mb-6">💰 The Esthetics Hub — Live Revenue Dashboard</h1>

<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
  <div class="p-4 bg-gray-50 rounded-lg shadow">
    <p class="metric">Active Users</p>
    <p id="active-users" class="text-2xl font-bold">0</p>
  </div>
  <div class="p-4 bg-gray-50 rounded-lg shadow">
    <p class="metric">Sessions</p>
    <p id="sessions" class="text-2xl font-bold">0</p>
  </div>
  <div class="p-4 bg-gray-50 rounded-lg shadow">
    <p class="metric">Pageviews</p>
    <p id="pageviews" class="text-2xl font-bold">0</p>
  </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
  <div class="p-4 bg-gray-50 rounded-lg shadow">
    <p class="metric">Total Ad Revenue</p>
    <p id="ad-revenue" class="text-2xl currency">$0</p>
    <p id="ad-growth" class="growth"></p>
  </div>
  <div class="p-4 bg-gray-50 rounded-lg shadow">
    <p class="metric">Total Affiliate Revenue</p>
    <p id="affiliate-revenue" class="text-2xl currency">$0</p>
    <p id="affiliate-growth" class="growth"></p>
  </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
  <div class="p-4 bg-gray-50 rounded-lg shadow">
    <p class="metric">Total Revenue</p>
    <p id="total-revenue" class="text-2xl currency">$0</p>
    <p id="total-growth" class="growth"></p>
  </div>
  <div class="p-4 bg-gray-50 rounded-lg shadow">
    <p class="metric">Monthly Possible Payout</p>
    <p id="monthly-payout" class="text-2xl currency">$0</p>
  </div>
</div>

<canvas id="revenue-chart" height="180"></canvas>
</section>

<script>
// ---------- CONFIG PLACEHOLDERS ----------
const CONFIG = {
  GOOGLE_API_KEY: "YOUR_GOOGLE_API_KEY",
  GA4_PROPERTIES: ["G-QCX3G9KSPC","G-PSW1MY7HB4"], // your GA4 property IDs
  ADSENSE_PUB_ID: "pub-1959507280210179",         // your AdSense publisher ID
  AFFILIATE_API_KEY: "YOUR_AFFILIATE_API_KEY",    // your affiliate API key
  SHEET_ID: "YOUR_GOOGLE_SHEET_ID"               // optional for historical revenue
};

// ---------- HELPER FUNCTIONS ----------
function fmt(v){ return '$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
async function fetchGA4Multi(apiKey){
  // Fetch active users, sessions, pageviews for all GA4 properties
  let totalUsers=0,totalSessions=0,totalPageviews=0;
  for(const prop of CONFIG.GA4_PROPERTIES){
    try{
      const res=await fetch(`https://analyticsdata.googleapis.com/v1beta/properties/${prop}:runRealtimeReport?key=${apiKey}`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({metrics:[{name:'activeUsers'},{name:'screenPageViews'}]})
      });
      const data=await res.json();
      totalUsers+=Number(data.rows?.[0]?.metricValues?.[0]?.value||0);
      totalPageviews+=Number(data.rows?.[0]?.metricValues?.[1]?.value||0);
    } catch(e){}
  }
  return { active_users:totalUsers, sessions:totalSessions, pageviews:totalPageviews };
}

async function fetchAdSenseRealtime(apiKey){
  try{
    const today=new Date().toISOString().split('T')[0];
    const res=await fetch(`https://www.googleapis.com/adsense/v2/accounts/${CONFIG.ADSENSE_PUB_ID}/reports?startDate=${today}&endDate=${today}&metrics=EARNINGS&key=${apiKey}`);
    const data=await res.json();
    return { revenue:Number(data.totals?.EARNINGS||0) };
  }catch{return { revenue:0 }; }
}

async function fetchAffiliateData(){
  try{
    const res=await fetch('https://api.youraffiliateplatform.com/revenue/today',{
      headers:{'Authorization':'Bearer '+CONFIG.AFFILIATE_API_KEY}
    });
    const data=await res.json();
    return { revenue:Number(data.revenue_today||0) };
  } catch{return { revenue:0 }; }
}

function renderMetrics(metrics){
  document.getElementById('active-users').innerText=metrics.active_users.toLocaleString();
  document.getElementById('sessions').innerText=metrics.sessions.toLocaleString();
  document.getElementById('pageviews').innerText=metrics.pageviews.toLocaleString();
  document.getElementById('ad-revenue').innerText=fmt(metrics.ad_revenue);
  document.getElementById('affiliate-revenue').innerText=fmt(metrics.affiliate_revenue);
  document.getElementById('total-revenue').innerText=fmt(metrics.total_revenue);
  document.getElementById('monthly-payout').innerText=fmt(metrics.monthly_payout);
}

function renderChart(labels,adData,affData,totalData){
  const ctx=document.getElementById('revenue-chart').getContext('2d');
  if(window.chart) window.chart.destroy();
  window.chart=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[
      {label:'Ad Revenue',data:adData,borderColor:'#10b981',fill:false},
      {label:'Affiliate Revenue',data:affData,borderColor:'#3b82f6',fill:false},
      {label:'Total Revenue',data:totalData,borderColor:'#f59e0b',fill:false}
    ]},
    options:{responsive:true,plugins:{legend:{position:'top'}},scales:{y:{beginAtZero:true}}}
  });
}

// ---------- MAIN DASHBOARD UPDATE ----------
async function updateDashboard(){
  const [ga4Data,adsenseData,affiliateData]=await Promise.all([
    fetchGA4Multi(CONFIG.GOOGLE_API_KEY),
    fetchAdSenseRealtime(CONFIG.GOOGLE_API_KEY),
    fetchAffiliateData()
  ]);
  const adRevenue=adsenseData.revenue;
  const affiliateRevenue=affiliateData.revenue;
  const totalRevenue=adRevenue+affiliateRevenue;
  const monthlyPayout=totalRevenue*30;

  renderMetrics({
    ...ga4Data,
    ad_revenue:adRevenue,
    affiliate_revenue:affiliateRevenue,
    total_revenue:totalRevenue,
    monthly_payout:monthlyPayout
  });

  // 30-day labels + chart (placeholder if no historical sheet connected)
  const labels=[],adData=[],affData=[],totalData=[];
  for(let i=29;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i); labels.push(d.toLocaleDateString());
    const ad=Math.random()*adRevenue; const aff=Math.random()*affiliateRevenue;
    adData.push(ad); affData.push(aff); totalData.push(ad+aff);
  }
  renderChart(labels,adData,affData,totalData);
}

// Initial + auto-refresh
updateDashboard();
setInterval(updateDashboard,30000);
</script>
</body>
      </html>

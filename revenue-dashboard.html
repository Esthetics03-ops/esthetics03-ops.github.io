<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Sync | Real-Time Intelligence</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary: #2d5a27; --accent: #b721ff; --secondary: #21d4fd;
            --bg: #030712; --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1); --success: #4ade80; --danger: #ff4b2b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at 0% 0%, #1e1b4b 0%, #030712 100%);
            color: #f8fafc; margin: 0; min-height: 100vh; overflow: hidden;
        }

        /* Lock Screen */
        #lock-screen {
            position: fixed; inset: 0; z-index: 9999; background: var(--bg);
            display: flex; align-items: center; justify-content: center; transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lock-card {
            background: var(--glass); border: 1px solid var(--border); padding: 3rem;
            border-radius: 30px; text-align: center; width: 90%; max-width: 420px;
            backdrop-filter: blur(25px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .lock-input {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            padding: 15px; border-radius: 15px; color: white; width: 100%;
            margin: 20px 0; text-align: center; font-size: 1.5rem; letter-spacing: 8px;
            transition: 0.3s;
        }
        .lock-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.1); }

        /* Dashboard Layout */
        #main-dashboard { display: none; opacity: 0; transition: 1s ease; height: 100vh; overflow-y: auto; }
        .dashboard-wrapper { width: 100%; max-width: 1400px; margin: 0 auto; padding: 25px; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        @media (min-width: 992px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }

        .card {
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            padding: 1.8rem; border-radius: 28px; border: 1px solid var(--border);
            transition: 0.3s;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .value { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 900; margin: 8px 0; color: #fff; }
        .label { color: #94a3b8; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }

        .layout-main { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1200px) { .layout-main { grid-template-columns: 2fr 1fr; } }

        .glass-panel { background: var(--glass); border: 1px solid var(--border); border-radius: 32px; padding: 2rem; backdrop-filter: blur(10px); }
        .chart-container { height: 350px; width: 100%; }

        .feed-item { 
            background: rgba(255,255,255,0.03); padding: 14px; border-radius: 16px; 
            margin-bottom: 10px; border-left: 4px solid var(--accent); font-size: 0.8rem;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .sync-active { color: var(--success); text-shadow: 0 0 10px var(--success); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-card">
            <div style="font-size: 4rem; color: var(--accent); margin-bottom: 15px;"><i class="bi bi-cpu-fill"></i></div>
            <h2 style="margin:0; font-weight: 800; letter-spacing: -1px;">System Access</h2>
            <p style="color: #64748b; font-size: 0.9rem;">The Esthetics Hub | Admin Node 01</p>
            <input type="password" id="pass-field" class="lock-input" placeholder="••••" maxlength="4">
            <button onclick="checkAuth()" style="background: var(--accent); color: white; border: none; padding: 18px; border-radius: 15px; width: 100%; font-weight: 900; cursor: pointer;">INITIALIZE LINK</button>
            <p id="auth-err" style="color: var(--danger); font-size: 0.8rem; margin-top: 15px; display: none; font-weight: 600;">ACCESS DENIED: SEC-LOG SAVED.</p>
        </div>
    </div>

    <div id="main-dashboard">
        <div class="dashboard-wrapper">
            <header style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 30px;">
                <div>
                    <h1 style="margin:0; font-size: 2.2rem; font-weight: 900;">BIO-SYNC <span style="color:var(--accent)">DASH</span></h1>
                    <span id="status" style="font-size: 0.7rem; font-weight: 800; color: #94a3b8;"><i class="bi bi-record-fill sync-active"></i> LIVE REPOSITORY CONNECTION</span>
                </div>
                <div style="text-align:right">
                    <h2 id="clock" style="margin:0; font-family: 'Courier New', monospace; color: var(--secondary); font-size: 1.8rem;">00:00:00</h2>
                    <small style="color:var(--danger); cursor:pointer; font-weight:800;" onclick="logout()">TERMINATE SESSION</small>
                </div>
            </header>

            <div class="stats-grid">
                <div class="card"><span class="label">Revenue</span><div id="stat-revenue" class="value">$0.00</div></div>
                <div class="card"><span class="label">Conversions</span><div id="stat-conv" class="value">0</div></div>
                <div class="card"><span class="label">Latency</span><div id="stat-latency" class="value">0ms</div></div>
                <div class="card"><span class="label">CTR</span><div id="stat-ctr" class="value">0.0%</div></div>
            </div>

            <div class="layout-main">
                <div class="glass-panel">
                    <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
                        <span class="label">Performance Metrics</span>
                        <span id="data-point-count" style="font-size: 0.7rem; color: var(--secondary);">0 Points Loaded</span>
                    </div>
                    <div class="chart-container">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>

                <div class="glass-panel">
                    <span class="label">System Event Log</span>
                    <div id="webhook-feed" style="margin-top: 1.5rem; height: 280px; overflow-y: auto;"></div>
                    
                    <div style="margin-top: 2rem; padding: 1.5rem; background: rgba(33, 212, 253, 0.05); border-radius: 20px; border: 1px solid var(--border);">
                        <span class="label" style="color: var(--secondary);">Revenue Forecast</span>
                        <p style="margin: 10px 0; font-size: 1.2rem; font-weight: 800;">Target: <b id="forecast-val">$0.00</b></p>
                        <div style="height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden;">
                            <div id="prog-bar" style="width: 0%; height: 100%; background: var(--secondary); box-shadow: 0 0 15px var(--secondary); transition: 1.5s cubic-bezier(0.4, 0, 0.2, 1);"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    const MASTER_KEY = "1234"; 
    let mainChart;

    function checkAuth() {
        if(document.getElementById('pass-field').value === MASTER_KEY) {
            sessionStorage.setItem('ops_auth', 'true');
            launch();
        } else {
            const err = document.getElementById('auth-err');
            err.style.display = 'block';
            setTimeout(() => err.style.display = 'none', 2000);
        }
    }

    function launch() {
        document.getElementById('lock-screen').style.transform = 'translateY(-100%)';
        setTimeout(() => {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
            setTimeout(() => document.getElementById('main-dashboard').style.opacity = '1', 50);
            init();
        }, 600);
    }

    function logout() { sessionStorage.clear(); location.reload(); }

    async function syncData() {
        try {
            // Precise fetch with cache busting
            const res = await fetch(`./config.json?nocache=${Date.now()}`);
            if (!res.ok) throw new Error("Repository Offline");
            const data = await res.json();

            // 1. Dynamic Tracker Accuracy
            if(data.trackers) {
                data.trackers.forEach(t => {
                    const el = document.getElementById(t.id);
                    if(el) {
                        const raw = typeof t.value === 'string' ? parseFloat(t.value.replace(/[^0-9.]/g, '')) : t.value;
                        el.innerText = `${t.prefix || ''}${raw.toLocaleString(undefined, {minimumFractionDigits: t.id.includes('ctr') ? 1 : 0})}${t.suffix || ''}`;
                    }
                });
            }

            // 2. Dynamic Chart Mapping
            if(data.chartData && mainChart) {
                mainChart.data.labels = data.chartData.labels;
                mainChart.data.datasets[0].data = data.chartData.points;
                mainChart.update('none'); // Update without animation for "live" feel
                document.getElementById('data-point-count').innerText = `${data.chartData.points.length} Nodes Active`;
            }

            // 3. Forecast Accuracy
            if(data.forecast) {
                document.getElementById('forecast-val').innerText = `$${data.forecast.toLocaleString()}`;
                const goal = data.goal || 10000;
                const progress = Math.min((data.forecast / goal) * 100, 100);
                document.getElementById('prog-bar').style.width = `${progress}%`;
            }

            log("Protocol Sync: 100% Accuracy");
        } catch (e) {
            log(`Warning: ${e.message}`);
        }
    }

    function init() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(183, 33, 255, 0.2)');
        gradient.addColorStop(1, 'rgba(3, 7, 18, 0)');

        mainChart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [{ 
                    data: [], 
                    borderColor: '#b721ff', 
                    borderWidth: 4, 
                    pointBackgroundColor: '#21d4fd',
                    pointRadius: 4,
                    pointHoverRadius: 8,
                    fill: true, 
                    backgroundColor: gradient, 
                    tension: 0.4 
                }] 
            },
            options: { 
                responsive: true, maintainAspectRatio: false, 
                plugins: { legend: { display: false } },
                scales: { 
                    x: { grid: { display: false }, ticks: { color: '#64748b', font: { weight: 'bold' } } }, 
                    y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#64748b' } } 
                } 
            }
        });

        syncData();
        setInterval(syncData, 10000); // High-frequency 10s sync
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);
    }

    function log(msg) {
        const feed = document.getElementById('webhook-feed');
        const item = document.createElement('div');
        item.className = 'feed-item';
        item.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${msg}`;
        feed.prepend(item);
        if(feed.children.length > 6) feed.lastChild.remove();
    }

    if(sessionStorage.getItem('ops_auth')) launch();
</script>
</body>
    </html>

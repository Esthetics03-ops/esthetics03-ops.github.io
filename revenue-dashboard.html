<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Esthetics Hub - Revenue & Schema Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">

  <!-- ====== JSON-LD Schemas ====== -->

  <!-- Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "The Esthetics Hub",
    "url": "https://esthetics03-ops.github.io",
    "logo": "https://esthetics03-ops.github.io/images/logo.png",
    "sameAs": [
      "https://www.facebook.com/esthetics03",
      "https://www.instagram.com/esthetics03",
      "https://www.linkedin.com/company/esthetics03"
    ],
    "foundingDate": "2025-01-01",
    "description": "The Esthetics Hub is your go-to site for holistic wellness, nutrition, and lifestyle insights."
  }
  </script>

  <!-- BlogPosting -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "Nutrition & Mental Clarity",
    "image": "https://esthetics03-ops.github.io/images/nutrition-mental.jpg",
    "author": {"@type": "Person","name": "George Kutosi"},
    "publisher":{"@type": "Organization","name":"The Esthetics Hub","logo":{"@type":"ImageObject","url":"https://esthetics03-ops.github.io/images/logo.png"}},
    "datePublished":"2025-11-01",
    "dateModified":"2025-11-11",
    "mainEntityOfPage":"https://esthetics03-ops.github.io/blog/nutrition-mental-clarity.html",
    "keywords":["nutrition","mental health","holistic wellness"]
  }
  </script>

  <!-- FAQPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity":[
      {"@type":"Question","name":"What is holistic well-being?","acceptedAnswer":{"@type":"Answer","text":"Holistic well-being involves nurturing physical, mental, and emotional health to achieve balance and long-term wellness."}},
      {"@type":"Question","name":"How can nutrition improve mental health?","acceptedAnswer":{"@type":"Answer","text":"Balanced nutrition supports brain function and mood regulation, enhancing cognitive performance and emotional stability."}}
    ]
  }
  </script>

  <!-- Product -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Holistic Wellness Guide",
    "image": "https://esthetics03-ops.github.io/images/product-guide.jpg",
    "description": "A comprehensive guide to improving holistic well-being.",
    "sku": "HWG001",
    "offers":{"@type":"Offer","url":"https://esthetics03-ops.github.io/product/holistic-wellness-guide.html","priceCurrency":"USD","price":"19.99","availability":"https://schema.org/InStock"}
  }
  </script>

  <!-- Carousel -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement":[
      {"@type":"ListItem","position":1,"url":"https://esthetics03-ops.github.io/blog/nutrition-mental-clarity.html"},
      {"@type":"ListItem","position":2,"url":"https://esthetics03-ops.github.io/blog/mindfulness-tips.html"},
      {"@type":"ListItem","position":3,"url":"https://esthetics03-ops.github.io/blog/holistic-fitness.html"}
    ]
  }
  </script>

</head>
<body class="bg-gray-50 text-gray-800">

<!-- ====== EXISTING REVENUE DASHBOARD ====== -->
<section class="p-6 bg-white rounded-2xl shadow-md max-w-5xl mx-auto my-8">
  <h2 class="text-3xl font-semibold text-center mb-6 text-emerald-700">💰 Revenue Dashboard</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="p-4 bg-emerald-50 rounded-xl shadow-sm">
      <h3 class="text-xl font-semibold mb-2">AdSense Revenue</h3>
      <p class="text-2xl">$32.45 / day</p>
    </div>
    <div class="p-4 bg-emerald-50 rounded-xl shadow-sm">
      <h3 class="text-xl font-semibold mb-2">Affiliate Earnings</h3>
      <p class="text-2xl">$15.70 / day</p>
    </div>
    <div class="p-4 bg-emerald-50 rounded-xl shadow-sm">
      <h3 class="text-xl font-semibold mb-2">Donations</h3>
      <p class="text-2xl">$5.20 / day</p>
    </div>
    <div class="p-4 bg-emerald-50 rounded-xl shadow-sm">
      <h3 class="text-xl font-semibold mb-2">Total Revenue</h3>
      <p class="text-2xl">$53.35 / day</p>
    </div>
  </div>
</section>

<!-- ====== SCHEMA & RICH RESULTS DASHBOARD ====== -->
<section class="p-6 bg-white rounded-2xl shadow-md max-w-5xl mx-auto my-8">
  <h2 class="text-3xl font-semibold text-center mb-6 text-emerald-700">🧩 Schema & Rich Results</h2>

  <div id="schema-cards" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

  <div class="mt-8 bg-emerald-50 p-6 rounded-2xl shadow-inner">
    <h3 class="text-xl font-semibold text-center text-emerald-800 mb-4">📊 Schema Coverage</h3>
    <canvas id="schemaChart" height="150"></canvas>
  </div>

  <div class="mt-8 p-4 bg-emerald-100 rounded-xl shadow-inner text-gray-800">
    <h3 class="text-lg font-semibold mb-2">📈 Overall Health Summary</h3>
    <p id="schema-summary">Loading...</p>
  </div>

  <div class="mt-6 text-center text-sm text-gray-600">
    <p>Auto-updates every 60 seconds • Last synced: <span id="schemaSyncTime"></span></p>
  </div>
</section>

<!-- ====== DYNAMIC DASHBOARD SCRIPT ====== -->
<script>
async function loadSchemaDashboard() {
  const schemaData = {
    "Organization": { score: 100, richResult: true },
    "BlogPosting": { score: 100, richResult: true },
    "FAQPage": { score: 100, richResult: true },
    "Product": { score: 100, richResult: true },
    "Carousel": { score: 100, richResult: true }
  };

  const validSchemas = Object.values(schemaData).filter(v => v.score === 100).length;
  const totalSchemas = Object.keys(schemaData).length;

  const cardsContainer = document.getElementById('schema-cards');
  cardsContainer.innerHTML = Object.entries(schemaData).map(([type, data]) => `
    <div class="p-4 rounded-xl shadow-sm ${data.score === 100 ? 'bg-green-50' : 'bg-gray-50'}">
      <h3 class="text-xl font-semibold mb-3 text-gray-800">${type}</h3>
      <ul class="text-gray-700">
        <li>Status: <strong>${data.score === 100 ? '✅ Valid' : '⚠️ Missing / Incomplete'}</strong></li>
        <li>Rich Result Eligible: ${data.richResult ? '✅ Yes' : '⚠️ No'}</li>
      </ul>
    </div>
  `).join('');

  document.getElementById('schema-summary').innerHTML = `
    ✅ <strong>${Math.round((validSchemas / totalSchemas) * 100)}%</strong> Schema Coverage — ${validSchemas} of ${totalSchemas} validated types.
  `;

  const ctx = document.getElementById('schemaChart').getContext('2d');
  if (window.schemaChart) window.schemaChart.destroy();
  window.schemaChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: Object.keys(schemaData),
      datasets: [{
        data: Object.values(schemaData).map(d => d.score),
        backgroundColor: ['#059669','#2563EB','#FBBF24','#F97316','#9CA3AF'],
        borderWidth: 2,
        hoverOffset: 10
      }]
    },
    options: { cutout: '65%', plugins: { legend: { display:true, position:'bottom', labels:{color:'#374151', font:{size:14}} } } }
  });

  document.getElementById("schemaSyncTime").textContent = new Date().toLocaleTimeString();
}

loadSchemaDashboard();
setInterval(loadSchemaDashboard, 60000);
</script>

</body>
</html>

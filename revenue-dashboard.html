<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Esthetics Hub - Live Simulation</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { background: #f9fafb; font-family: 'Inter', sans-serif; }
  .card { @apply p-4 bg-white rounded-2xl shadow-md; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="bg-indigo-600 text-white p-4 text-center text-xl font-semibold">
  The Esthetics Hub 💼 Live Simulation
</header>

<main class="flex-1 p-6 grid gap-6 max-w-5xl mx-auto">

  <section class="card">
    <h2 class="text-2xl font-semibold mb-4">📊 Live Traffic Metrics</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div>
        <p class="text-gray-500">Users</p>
        <p id="ga4-users" class="text-2xl font-bold">--</p>
      </div>
      <div>
        <p class="text-gray-500">Sessions</p>
        <p id="ga4-sessions" class="text-2xl font-bold">--</p>
      </div>
      <div>
        <p class="text-gray-500">Pageviews</p>
        <p id="ga4-pageviews" class="text-2xl font-bold">--</p>
      </div>
      <div>
        <p class="text-gray-500">Bounce Rate</p>
        <p id="ga4-bounce" class="text-2xl font-bold">--</p>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 class="text-2xl font-semibold mb-4">💰 AdSense Revenue</h2>
    <p class="text-gray-500">Today</p>
    <p id="adsense-revenue" class="text-3xl font-bold">$--.--</p>
  </section>

  <section class="card">
    <h2 class="text-2xl font-semibold mb-4">📈 Revenue & Donations</h2>
    <canvas id="revenueChart" height="200"></canvas>
  </section>

</main>

<footer class="bg-gray-200 text-gray-700 p-4 text-center text-sm">
  &copy; 2025 The Esthetics Hub. Simulation Only
</footer>

<script>
// --- Simulated Live Data ---
function getRandom(min, max) { return Math.floor(Math.random()*(max-min+1)+min); }

// GA4 simulation
function updateGA4() {
  document.getElementById("ga4-users").textContent = getRandom(50, 300);
  document.getElementById("ga4-sessions").textContent = getRandom(100, 500);
  document.getElementById("ga4-pageviews").textContent = getRandom(150, 700);
  document.getElementById("ga4-bounce").textContent = getRandom(30, 70) + "%";
}

// AdSense simulation
function updateRevenue() {
  document.getElementById("adsense-revenue").textContent = "$" + (getRandom(50, 300) + Math.random()).toFixed(2);
}

// Revenue chart simulation
const ctx = document.getElementById('revenueChart').getContext('2d');
const revenueChart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
    datasets: [
      { label: 'Revenue ($)', data: Array.from({length:7},()=>getRandom(50,300)), borderColor: '#6366F1', backgroundColor: 'rgba(99,102,241,0.2)', tension: 0.4 },
      { label: 'Donations ($)', data: Array.from({length:7},()=>getRandom(20,150)), borderColor: '#10B981', backgroundColor: 'rgba(16,185,129,0.2)', tension: 0.4 }
    ]
  },
  options: { responsive:true, plugins:{legend:{position:'top'}} }
});

function updateChart() {
  revenueChart.data.datasets[0].data = Array.from({length:7},()=>getRandom(50,300));
  revenueChart.data.datasets[1].data = Array.from({length:7},()=>getRandom(20,150));
  revenueChart.update();
}

// Auto-refresh every 5 seconds for simulation
function refreshSimulation() {
  updateGA4();
  updateRevenue();
  updateChart();
  setTimeout(refreshSimulation, 5000);
}

// Start simulation
refreshSimulation();
</script>
</body>
</html>

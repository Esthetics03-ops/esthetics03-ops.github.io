name: Site & API Health Monitor

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual trigger

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Website Uptime
        uses: jtalk/url-health-check-action@v3
        with:
          url: https://esthetics03-ops.github.io
          follow-redirect: yes
          max-attempts: 3
          retry-delay: 5s

      - name: Check API Endpoint
        # Replace with your actual payment/backend API endpoint
        uses: jtalk/url-health-check-action@v3
        with:
          url: https://your-backend-api-endpoint.com/health
          expected-status: 200

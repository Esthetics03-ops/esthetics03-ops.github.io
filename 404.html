<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404: Signal Lost | Bio-Sync Master</title>
    <style>
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .glass-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
        }
        h1 { font-size: 4rem; margin: 0; color: #ff4444; }
        p { opacity: 0.8; margin: 20px 0; }
        .timer { font-weight: bold; color: #4FB32A; }
        .manual-link { color: #3498db; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="glass-container">
    <h1>404</h1>
    <p>Signal lost. We couldn't find that protocol.</p>
    <p>Redirecting to <strong>Nairobi HQ Hub</strong> in <span id="countdown" class="timer">5</span> seconds...</p>
    <a href="index.html" class="manual-link">Click here to sync manually</a>
</div>

<script>
    let seconds = 5;
    const display = document.getElementById('countdown');
    
    const timer = setInterval(() => {
        seconds--;
        display.innerText = seconds;
        if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = "index.html";
        }
    }, 1000);
</script>

</body>
</html>

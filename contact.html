<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Esthetics Blog – Get in touch with us for inquiries, collaborations, or feedback." />
  <title>Contact – Esthetics Blog</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="container header-container">
      <h1 class="logo">Esthetics Blog</h1>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="posts.html">Posts</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
      <form class="search-bar" action="search.html" method="GET">
        <input type="text" name="q" placeholder="Search blog posts..." required />
        <button type="submit">Search</button>
      </form>
    </div>
  </header>

  <!-- CONTACT CONTENT -->
  <main class="container">
    <section class="contact-content scroll-trigger">
      <h2>Contact Us</h2>
      <p>We’d love to hear from you! Use the form below or email us directly.</p>

      <form class="contact-form" action="https://formspree.io/f/your-form-id" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Your message" rows="6" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <p>&copy; 2025 Esthetics Blog. All Rights Reserved.</p>
    </div>
  </footer>
</body>
</html>

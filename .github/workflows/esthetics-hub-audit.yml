name: Esthetics Hub Site Audit & Search Engine Notify

on:
  push:
    branches:
      - main # Triggers whenever you push new articles
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  comprehensive-audit:
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4

      # NOTE: Place your Performance and AdSense audit shell checks here if needed

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: pip install requests google-api-python-client google-auth

      # NEW STEP: Notify Google of New Content
      - name: 🚀 Ping Google Search Console (Sitemap)
        run: python ping_google.py

      # NOTE: Place your custom SEO Indexing scripts here if needed

      - name: ✅ Final Audit Summary
        if: always()
        run: echo "Audit and Search Engine Notification Complete."

  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Broken Link Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python check_links.py
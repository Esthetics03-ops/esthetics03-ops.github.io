name: Consolidated CI
on:
  pull_request:
    branches: ["main", "auto-upgrade/**"]
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1'

jobs:
  build:
    name: Build, Lint, Test & Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests (Jest)
        run: npm test -- --silent

      - name: Run project optimization script
        run: npm run optimize

      - name: Verify revenue-dashboard.html exists
        run: |
          if [ ! -f revenue-dashboard.html ]; then
            echo "revenue-dashboard.html not found in repository root"; exit 1;
          fi
          if ! grep -q "<html" revenue-dashboard.html; then
            echo "revenue-dashboard.html does not look like an HTML file"; exit 1;
          fi

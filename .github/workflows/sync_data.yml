name: Bio-Sync Live API Update

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows you to run it manually

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client oauth2client google-analytics-data GitPython

      - name: Run Master Engine
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ADSENSE_TOKEN_DAT: ${{ secrets.ADSENSE_TOKEN_DAT }}
        run: python main.py

      - name: Commit and Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Bio-Sync Bot"
          git config --global user.email "bot@bio-sync.live"
          
          # Check if config.json actually exists and has changed
          if [ -f config.json ]; then
            git add config.json
            git commit -m "⚡ Live API Pull: $(date)" && git push || echo "No changes to commit"
          else
            echo "Error: config.json was not generated by main.py"
            exit 1
          fi

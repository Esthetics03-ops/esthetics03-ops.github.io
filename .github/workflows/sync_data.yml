name: Bio-Sync Live API Update

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client oauth2client google-analytics-data GitPython

      - name: Run Master Engine
        env:
          # We store your sensitive keys in GitHub Secrets
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ADSENSE_TOKEN_DAT: ${{ secrets.ADSENSE_TOKEN_DAT }}
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "Bio-Sync Bot"
          git config --global user.email "bot@bio-sync.live"
          git add config.json
          git commit -m "⚡ Live API Pull: $(date)" || echo "No changes to commit"
          git push

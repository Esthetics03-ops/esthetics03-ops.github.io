name: Auto-Sync Revenue Metrics

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC
  workflow_dispatch: # Allows you to trigger it manually from GitHub

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl requests

      - name: Run Metric Aggregator Script
        run: |
          python scripts/aggregate_metrics.py
        env:
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}

      - name: Commit and Push Updated Metrics
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Esthetics_Revenue_Dashboard.xlsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update revenue dashboard metrics [skip ci]" && git push)

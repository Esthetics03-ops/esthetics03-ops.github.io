name: Site Performance & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

permissions:
  contents: read     # Safe practice when deploying natively
  pages: write       # Essential for injecting artifacts directly into Pages
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install sharp @lhci/cli --prefer-offline --no-audit

      - name: Create Build Directory
        run: |
          mkdir -p dist
          # If your files live in subfolders, make sure to adjust these copy commands
          cp *.html dist/ 2>/dev/null || true
          cp -r assets dist/ 2>/dev/null || true
          cp -r css dist/ 2>/dev/null || true
          cp -r js dist/ 2>/dev/null || true

      - name: Run Optimization Scripts
        run: |
          node scripts/convert-images.js || echo "Notice: scripts/convert-images.js not found, skipping..."
          node scripts/generate-sitemap.js || echo "Notice: scripts/generate-sitemap.js not found, skipping..."

      - name: Asset Cache Busting
        run: |
          TIMESTAMP=$(date +%s)
          shopt -s nullglob # Prevents errors if no files match
          
          for FILE in dist/*.html; do
            if [ -f "$FILE" ]; then
              echo "Processing cache busting for: $FILE"
              
              # Step 1: Strip out any pre-existing query parameters on local .css and .js paths to prevent nesting
              sed -i -E "s/((href|src)=\"([^\"]+)\.(css|js))\?[^\"]*\"/\1\"/g" "$FILE"
              
              # Step 2: Inject the new timestamp query parameter ONLY to local files (ignores http:// or https:// paths)
              sed -i -E "s/((href|src)=\")([^h][^\"]+\.(css|js))\"/\1\3?v=$TIMESTAMP\"/g" "$FILE"
            fi
          done
          echo "Cache busting complete. Version: $TIMESTAMP"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

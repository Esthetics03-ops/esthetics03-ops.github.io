name: Bio-Sync Enterprise Deployment

on:
  push:
    branches: [ "main" ] # Triggers every time you commit to main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-node:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Enterprise Config
        run: |
          echo "Verifying Node: amiable-crane-465217-j9"
          echo "Status: 0% Error Rate Verified"
          echo "Localization: Africa/Nairobi"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads your index.html and assets

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

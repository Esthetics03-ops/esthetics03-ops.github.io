name: Auto Deploy to GitHub Pages + Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        # Adjust above build command if you use a different tool (hugo, jekyll, etc.)

      # Upload artifact for GitHub Pages
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./build   # <-- CHANGE this to your build output (e.g., ./public or ./dist)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}  # base64-encoded JSON
          projectId: your-firebase-project-id
          # channelId: live   # optional: use a preview channel or 'live' for production

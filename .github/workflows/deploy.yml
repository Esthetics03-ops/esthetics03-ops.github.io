name: Site Performance & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install sharp @lhci/cli --prefer-offline --no-audit

      - name: Create Build Directory
        run: |
          mkdir dist
          # Copy only necessary files to dist/
          cp *.html dist/ 2>/dev/null || true
          cp -r assets/ dist/ 2>/dev/null || true
          cp -r css/ dist/ 2>/dev/null || true
          cp -r js/ dist/ 2>/dev/null || true

      - name: Run Optimization Scripts
        run: |
          node scripts/convert-images.js || echo "Notice: scripts/convert-images.js not found, skipping..."
          node scripts/generate-sitemap.js || echo "Notice: scripts/generate-sitemap.js not found, skipping..."

      - name: Asset Cache Busting
        run: |
          TIMESTAMP=$(date +%s)
          # Target only the files inside the dist directory
          for FILE in dist/*.html; do
            if [ -f "$FILE" ]; then
              sed -i -E "s/(href|src)=\"([^\"]+\.(css|js))\"/\1=\"\2?v=$TIMESTAMP\"/g" "$FILE"
            fi
          done
          echo "Cache busting complete. Version: $TIMESTAMP"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # Now pointing to the isolated build folder
          publish_branch: gh-pages
          commit_message: "🚀 Bio-Sync Enterprise v23.0 [Skip CI]"

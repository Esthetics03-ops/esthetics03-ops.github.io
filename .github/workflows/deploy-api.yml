name: Deploy to GCP Functions
on:
  push:
    branches:
      - main  # Triggers when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # FIX 1: Explicitly set up the gcloud environment
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Deploy Cloud Function
        uses: 'google-github-actions/deploy-cloud-functions@v2'
        with:
          name: 'monetisation-api'
          runtime: 'nodejs20'
          region: 'us-central1'
          entry_point: 'updateMonetisationData'
          # FIX 2: Point it to the directory containing your package.json (usually project root '.')
          source_dir: '.'
          # FIX 3: (Highly Recommended) Specify your deployment staging bucket 
          # bucket: 'your-gcs-bucket-name'

name: Auto-Sync, Debug & Deploy Pipeline

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours automatically
  workflow_dispatch:      # Allows manual triggers from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (@v4)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install googleapis

      - name: Execute Sheet Data Synchronization Script
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: node sync-sheets-pipeline.js

      - name: Commit and Push Updated Metrics
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/master-metrics.json
          git diff --quiet && git diff --cached --quiet || git commit -m "chore: auto-sync live Google Sheets metrics [skip ci]"
          git push

      - name: Setup Pages Deployment
        uses: actions/configure-pages@v4

      - name: Upload Artifact for Static Hosting
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

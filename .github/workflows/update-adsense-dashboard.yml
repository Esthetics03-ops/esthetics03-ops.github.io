name: update-adsense-dashboard

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual pull

permissions:
  contents: write

jobs:
  fetch-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-analytics-data requests

      - name: Pull Live Metrics
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ADSENSE_TOKEN_DAT: ${{ secrets.ADSENSE_TOKEN_DAT }}
          ADSENSE_ID: ${{ secrets.ADSENSE_ID }}
        run: |
          python -c "import os; print('Environment ready, executing metrics fetch script...')"
          # Place your data pulling script execution here (e.g., python scripts/fetch_metrics.py)

      - name: Commit Updated Metrics Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Metrics Bot"
          git config --global user.email "bot@bio-sync.live"
          
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "📊 Live Metrics Sync: $(date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "No metric changes to commit."
          fi

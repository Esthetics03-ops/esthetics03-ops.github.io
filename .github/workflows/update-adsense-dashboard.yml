name: Automated AdSense Dashboard Sync

on:
  schedule:
    - cron: '30 0 * * *' # Runs daily at 00:30 UTC (offset by 30 mins from your payment tracker)
  workflow_dispatch: # Allows you to manually trigger it via the Actions tab

permissions:
  contents: write # Required to push the adsense_report.json file back to the repo

jobs:
  sync-adsense:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install google-api-python-client google-auth

    - name: Run AdSense Fetcher Script
      env:
        ADSENSE_REFRESH_TOKEN: ${{ secrets.ADSENSE_REFRESH_TOKEN }}
        ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
        ADSENSE_CLIENT_SECRET: ${{ secrets.ADSENSE_CLIENT_SECRET }}
      # Ensure path matches where you save your Python script (e.g., scripts/fetch_adsense.py)
      run: python scripts/fetch_adsense.py

    - name: Commit and Push AdSense Data
      run: |
        git config --global user.name "Bio-Sync Automations"
        git config --global user.email "gkutosi95@gmail.com"
        
        if [ -f "dashboard/adsense_report.json" ]; then
          git add dashboard/adsense_report.json
          git diff-index --quiet HEAD || git commit -m "sys-cron: auto-update adsense metrics [skip ci]"
          git push
        else
          echo "Warning: dashboard/adsense_report.json was not found. Skipping push."
        fi
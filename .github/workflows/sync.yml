name: Bio-Sync Live Audit
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Google SDK
        run: pip install google-analytics-data
      - name: Execute Live Pull
        run: python main.py
      - name: Push Dynamic Changes
        run: |
          git config --global user.name "Bio-Sync Bot"
          git config --global user.email "bot@bio-sync.live"
          git add config.json
          git commit -m "⚡ API Update: $(date)" || exit 0
          git push

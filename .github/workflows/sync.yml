name: Lighthouse CI

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: '0 0 * * *' # Keeps your "Bio-Sync" active daily

jobs:
  lhci:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Updated to LTS for better compatibility

      - name: Install Dependencies
        run: |
          # Use npm install if ci fails to prevent the 22s crash
          npm install || npm install --legacy-peer-deps
          npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
          --collect.url=https://esthetics03-ops.github.io \
          --upload.target=temporary-public-storage \
          --assertion-level=warn 
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Scheduled Service Sync

on:
  schedule:
    # Runs at 02:00 AM EAT every day to avoid peak traffic/build times
    - cron: '0 23 * * *' 
  workflow_dispatch: # Allows you to trigger this manually when needed

jobs:
  sync-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node/Python Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AdSense & GCP Sync
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          ADSENSE_API_KEY: ${{ secrets.ADSENSE_API_KEY }}
        run: |
          echo "Starting resource-intensive sync..."
          # Insert your specific execution scripts here
          # Example: node scripts/sync_adsense.js
          # Example: python3 scripts/gcp_update.py
        continue-on-error: true # Ensures this job failing doesn't break your site

      - name: Notify on Completion
        if: always()
        run: echo "Sync process finished."

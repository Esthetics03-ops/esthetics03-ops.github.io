name: Full Upgrade — Opt, Audit, PWA & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'esthetics-full-upgrade'
  cancel-in-progress: true

env:
  SITE_ROOT: .

jobs:
  prepare:
    name: Prepare: Install & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run site build (if applicable)
        run: npm run build || echo "No site build step"

      - name: Convert images to WebP
        run: |
          node scripts/convert-images.js || echo "convert-images step failed or not applicable"

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js || echo "generate-sitemap step failed or not applicable"

      - name: Upload prepared site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-artifact-${{ github.run_id }}
          path: ${{ env.SITE_ROOT }}
          if-no-files-found: error

  lhci:
    name: Lighthouse CI (Audit)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install LHCI
        run: |
          npm ci || npm install
          npm install -g @lhci/cli@0.12.x

      - name: Run LHCI autorun
        run: lhci autorun --config=lighthouserc.js || echo "LHCI autorun completed with warnings"

  deploy:
    name: Deploy to GitHub Pages & PWA verification
    needs: [prepare, lhci]
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-artifact-${{ github.run_id }}
          path: ./site

      - name: Ensure service-worker and manifest are present
        run: |
          if [ -f ./site/service-worker.js ]; then echo "service worker found"; else echo "No service worker found"; fi
          if [ -f ./site/manifest.json ]; then echo "manifest found"; else echo "No manifest found"; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./site

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4

name: Lighthouse CI

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: '0 0 * * *' # Keeps your "Bio-Sync" active daily

jobs:
  lhci:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Updated to LTS for better compatibility

      - name: Install system dependencies (Chrome, libvips)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser libvips-dev build-essential
          echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps
          npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_BIN: ${{ env.CHROME_BIN }}
        run: |
          # Ensure LHCI uses a headless, no-sandbox Chrome when running in containers
          lhci autorun \
            --collect.url=https://esthetics03-ops.github.io \
            --collect.chromeFlags="--no-sandbox --headless --disable-gpu" \
            --upload.target=temporary-public-storage \
            --assertion-level=warn || echo "LHCI completed with non-zero exit (treated as warning)."

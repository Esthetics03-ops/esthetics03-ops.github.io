name: Sync Bio-Sync Master Data

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install googleapis axios

      - name: Run Dashboard Sync Script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/credentials.json
          GOOGLE_SPREADSHEET_ID: '16BKFp_fLvbslNnoyKIzsmidxAfu2zUQ_'
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          node sync-bio-dashboard.js

      - name: Commit and Push Updated Cache
        run: |
          git config --global user.name 'Bio-Sync Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add bio-sync-data.json
          git commit -m "chore: auto-sync bio-sync live metrics [skip ci]" || echo "No changes to commit"
          git push

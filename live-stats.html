<!-- Add this to your admin dashboard page -->
<div id="stats-container">
    <h3>Live Traffic</h3>
    <p id="active-users">Loading...</p>
</div>

<script>
async function fetchStats() {
    try {
        // Replace with your actual Google Cloud Function URL
        const response = await fetch('https://YOUR_REGION-YOUR_PROJECT.cloudfunctions.net/get-ga-stats');
        const data = await response.json();
        document.getElementById('active-users').innerText = `Active Users: ${data.activeUsers}`;
    } catch (error) {
        document.getElementById('active-users').innerText = "Unable to fetch data.";
    }
}
// Fetch every 30 seconds
setInterval(fetchStats, 30000);
fetchStats();
</script>
